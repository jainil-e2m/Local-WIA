services:
  content-atelier:
    build: .
    ports:
      - "8080:8080"
    environment:
      # Local HTTP verification. Railway uses the image's production default.
      NODE_ENV: development
      PORT: "8080"
      COMMAND_CENTER_AUTH_ORIGIN: ${COMMAND_CENTER_AUTH_ORIGIN:?Set the Command Center server origin}
    init: true
    restart: unless-stopped
