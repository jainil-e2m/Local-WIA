[project]
name = "content-atelier-pipeline"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.116.1",
  "httpx==0.28.1",
  "openai==2.24.0",
  "pgvector==0.4.2",
  "psycopg[binary]==3.3.3",
  "pydantic==2.11.7",
  "redis==5.2.1",
  "rq==2.12.0",
  "sqlalchemy==2.0.51",
  "tiktoken==0.12.0",
  "tokenizers==0.19.1",
  "uvicorn==0.35.0",
  "pypdfium2==4.30.0",
  "pillow==11.3.0",
  "faster-whisper==1.2.0",
  "tzdata==2025.2",
]

[project.optional-dependencies]
test = ["pytest>=8,<10", "fakeredis==2.32.1"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["backend_pipeline/tests"]

[tool.ruff]
line-length = 130
