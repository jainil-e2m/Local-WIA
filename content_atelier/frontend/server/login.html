<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sign in · Content Atelier</title>
    <link rel="icon" type="image/png" href="/logos/wia_favicon.png">
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: #f6f7fb; color: #173354; font-family: system-ui, sans-serif; }
      main { width: 100%; max-width: 420px; padding: 40px; background: white; border: 1px solid #e8ebf1; border-radius: 24px; box-shadow: 0 16px 48px #1733540a; }
      .brand { color: #a88a52; font-size: 11px; letter-spacing: .2em; text-transform: uppercase; }
      h1 { margin: 16px 0; font-family: Georgia, serif; font-size: 32px; font-weight: 500; }
      p { color: #667184; font-size: 14px; line-height: 1.6; }
      label { display: block; margin-top: 20px; font-size: 13px; font-weight: 600; }
      input, button { width: 100%; min-height: 46px; border-radius: 10px; font: inherit; }
      input { margin-top: 8px; border: 1px solid #cfd5df; padding: 10px 12px; }
      input:focus { outline: 2px solid #c6a56a; outline-offset: 2px; }
      button { margin-top: 24px; border: none; background: #173354; color: white; cursor: pointer; }
      button:disabled { opacity: .6; cursor: wait; }
      #error { color: #a12c24; margin-bottom: 0; }
    </style>
  </head>
  <body>
    <main>
      <div class="brand">Wedding Industry Ads</div>
      <h1>Content Atelier</h1>
      <p>Sign in with your Command Center account to open your editorial workspace.</p>
      <form id="login">
        <label for="email">Email address</label>
        <input id="email" name="email" type="email" autocomplete="username" required>
        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required>
        <button type="submit">Sign in</button>
        <p id="error" role="alert" aria-live="polite" hidden></p>
      </form>
    </main>
    <script src="/login.js" defer></script>
  </body>
</html>
