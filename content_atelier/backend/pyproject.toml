[project]
name = "content-atelier-pipeline"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "boto3==1.40.0",
  "fastapi==0.116.1",
  "httpx==0.28.1",
  "pgvector==0.4.2",
  "psycopg[binary]==3.3.3",
  "pydantic==2.11.7",
  "redis==5.2.1",
  "rq==2.12.0",
  "tiktoken==0.12.0",
  "tokenizers==0.19.1",
  "uvicorn==0.35.0",
  "pypdfium2==4.30.0",
  "pillow==11.3.0",
  "faster-whisper==1.2.0",
  "tzdata==2025.2",
]

[project.optional-dependencies]
test = ["pytest>=8,<10", "fakeredis==2.32.1"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["backend_pipeline/tests"]

[tool.ruff]
line-length = 130

[tool.ruff.lint]
# Ruff's default rule set (plan S.B2): pycodestyle E4, E7, E9 and all of Pyflakes.
select = ["E4", "E7", "E9", "F"]
# E701/E702 flag one-line compound statements ("if x: y", "a; b"). They are this
# codebase's established compact style, not defects; reformatting every module would
# bury review of real changes. Everything else in the default set is enforced.
ignore = ["E701", "E702"]

[tool.ruff.lint.per-file-ignores]
# Pytest fixtures are imported from their defining module and requested as parameters.
"backend_pipeline/tests/*" = ["F811"]
# One-off scripts put backend/ on sys.path before importing the package.
"scripts/*" = ["E402"]
