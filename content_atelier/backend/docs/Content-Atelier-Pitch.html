<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Content Atelier</title>
<meta name="description" content="How the Content Atelier turns Wedding Industry Ads' client conversations into ready-to-approve content.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..600;1,6..96,400..500&family=Jost:wght@400;500;600&display=swap">
<style>
  :root {
    --bg: #F6F0EB;
    --surface: #FFFFFF;
    --ink: #1E1826;
    --text: #3A3242;
    --line: #D9CBC1;
    --line-soft: #E9DFD8;
    --gold: #8A6630;
    --gold-bright: #B98E4E;
    --gold-pale: #FFF6E9;
    --blush: #F2E2DA;
    --plum: #2A2132;
    --on-plum: #FBF7F4;
    --on-plum-2: #DCD2DF;
    --accent-on-plum: #E7C891;
    --display: "Bodoni Moda", "Didot", "Bodoni 72", Georgia, serif;
    --body: "Jost", "Futura", "Avenir Next", "Century Gothic", system-ui, sans-serif;
    --g: clamp(16px, 2.4vw, 36px);
    color-scheme: light;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; color: var(--ink);
    background:
      radial-gradient(1100px 520px at 8% -12%, #F9E4DB 0%, transparent 62%),
      radial-gradient(900px 480px at 102% 112%, #F2E5D2 0%, transparent 60%),
      var(--bg);
    font-family: var(--body); font-size: 16px; line-height: 1.5;
    display: grid; grid-template-rows: auto auto 1fr auto; overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }
  :focus-visible { outline: 2px solid var(--gold); outline-offset: 3px; border-radius: 6px; }

  /* Header */
  header { display: flex; align-items: center; justify-content: space-between; gap: 20px; padding: 16px var(--g) 0; }
  .brand { display: flex; align-items: center; gap: 14px; }
  .brand svg { width: 30px; height: 30px; flex: none; }
  .brand h1 { margin: 0; font-family: var(--display); font-weight: 500; font-size: 1.6rem; line-height: 1.1; letter-spacing: -0.01em; }
  .brand p { margin: 2px 0 0; font-size: 0.93rem; color: var(--text); }
  .legend { display: flex; align-items: center; gap: 24px; font-size: 0.93rem; color: var(--text); font-weight: 500; }
  .legend span { display: inline-flex; align-items: center; gap: 10px; }
  .lg-step { width: 17px; height: 17px; border-radius: 50%; border: 2px solid var(--ink); background: var(--surface); }
  .lg-gate { width: 13px; height: 13px; border: 2px solid var(--gold); background: var(--gold-pale); border-radius: 3px; transform: rotate(45deg); }

  /* Narration band */
  .narr {
    display: grid; grid-template-columns: 76px minmax(0, 1fr) minmax(300px, 420px); gap: 30px; align-items: center;
    padding: 18px var(--g) 8px; min-height: 164px;
  }
  .num { font: 500 3rem/1 var(--display); color: var(--gold); font-variant-numeric: tabular-nums; align-self: start; padding-top: 4px; }
  .num small { display: block; font: 600 0.7rem var(--body); letter-spacing: .14em; color: var(--text); margin-top: 8px; text-transform: uppercase; }
  .cap-text { display: grid; gap: 6px; align-content: center; }
  .cap-text .who { font: 600 0.76rem var(--body); letter-spacing: .14em; text-transform: uppercase; color: var(--gold); }
  .cap-text h2 { margin: 0; font: 500 1.9rem/1.15 var(--display); color: var(--ink); letter-spacing: -0.01em; text-wrap: balance; }
  .cap-text p { margin: 0; font-size: 1.06rem; color: var(--text); max-width: 78ch; }
  .anim > * { animation: rise .45s cubic-bezier(.2, .8, .2, 1) both; }
  .anim > *:nth-child(2) { animation-delay: .05s; }
  .anim > *:nth-child(3) { animation-delay: .1s; }
  @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

  .pv {
    background: var(--plum); color: var(--on-plum); border-radius: 16px; padding: 16px 20px 17px;
    font: 400 15px/1.45 var(--body); box-shadow: 0 22px 40px -24px rgba(30, 24, 38, .6);
    min-height: 118px; display: grid; align-content: center;
  }
  .pv-k { font: 600 11.5px var(--body); letter-spacing: .16em; text-transform: uppercase; color: var(--accent-on-plum); margin-bottom: 8px; }
  .pv q { display: block; font: italic 500 18px/1.35 var(--display); quotes: "\201C" "\201D"; }
  .pv .meta { margin-top: 7px; color: var(--on-plum-2); font-size: 13px; }
  .pv .chips { display: flex; flex-wrap: wrap; gap: 7px; }
  .pv .chip { padding: 4px 11px; border-radius: 999px; background: rgba(255, 255, 255, .1); border: 1px solid rgba(255, 255, 255, .2); font-size: 13px; }
  .pv .chip.ok::before { content: "✓ "; color: var(--accent-on-plum); }
  .pv ol { margin: 0; padding: 0; list-style: none; display: grid; gap: 6px; }
  .pv li { display: grid; grid-template-columns: 1fr 90px; gap: 12px; align-items: center; }
  .pv li i { display: block; height: 6px; border-radius: 3px; background: var(--accent-on-plum); transform-origin: left; animation: barIn .8s cubic-bezier(.2, .8, .2, 1) both; }
  @keyframes barIn { from { transform: scaleX(0); } }
  .pv .btns { display: flex; gap: 7px; margin-top: 10px; }
  .pv .btn { padding: 4px 12px; border-radius: 7px; font-size: 13px; font-weight: 500; border: 1px solid rgba(255, 255, 255, .3); }
  .pv .btn.primary { background: var(--accent-on-plum); color: var(--plum); border-color: var(--accent-on-plum); }
  .pv .rows { display: grid; gap: 4px; }
  .pv .rows b { color: var(--accent-on-plum); font-weight: 500; margin-right: 8px; }
  .pv .bar { margin-top: 10px; height: 6px; border-radius: 3px; background: rgba(255, 255, 255, .15); overflow: hidden; }
  .pv .bar i { display: block; height: 100%; width: 80%; background: var(--accent-on-plum); animation: grow 3.5s ease-out both; }
  @keyframes grow { from { width: 8%; } }

  /* Diagram */
  .stage { min-height: 0; padding: 4px var(--g) 0; overflow-x: auto; overflow-y: hidden; display: flex; }
  #diagram { flex: 1; width: 100%; height: 100%; display: block; min-width: 960px; }

  #diagram .lbl { font: 500 17px var(--body); fill: var(--ink); }
  #diagram .sub { font: 400 14.5px var(--body); fill: var(--text); }
  #diagram .detail { font: 400 13px var(--body); fill: var(--text); }
  #diagram .glbl { font: 600 16px var(--body); fill: var(--gold); }
  #diagram .gsub { font: 400 14px var(--body); fill: var(--text); }
  #diagram .cap { font: 600 12.5px var(--body); letter-spacing: .2em; fill: var(--gold); }
  #diagram .tag-t { font: 500 12px var(--body); fill: var(--gold); letter-spacing: .04em; }
  #diagram .tag-bg { fill: var(--gold-pale); stroke: #E8D2AE; stroke-width: 1; }
  #diagram .wire { fill: none; stroke: var(--line); stroke-width: 2.2; transition: stroke .5s; }
  #diagram .wire.lit { stroke: var(--gold-bright); }
  #diagram .tie { fill: none; stroke: var(--line); stroke-width: 1.6; stroke-dasharray: 3 5; transition: stroke .5s; }
  #diagram .tie.lit { stroke: var(--gold-bright); animation: dash 1s linear infinite; }
  #diagram .loop { fill: none; stroke: var(--line); stroke-width: 1.8; stroke-dasharray: 6 7; transition: stroke .5s; }
  #diagram .loop.lit { stroke: var(--gold-bright); animation: dash 1.2s linear infinite; }
  #diagram .arrow { fill: var(--line); transition: fill .5s; }
  #diagram .arrow.lit { fill: var(--gold-bright); }
  @keyframes dash { to { stroke-dashoffset: -26; } }

  .zone { fill: rgba(255, 255, 255, .8); stroke: #E4D6CC; stroke-width: 1.4; }

  .card rect.bg { fill: var(--surface); stroke: var(--line); stroke-width: 1.4; transition: stroke .5s, fill .5s; }
  .card.lit rect.bg { stroke: var(--gold-bright); fill: #FFFBF5; }
  .card .ico-bg { fill: var(--blush); }
  .card .ico { fill: none; stroke: var(--ink); stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }
  .card .ico-t { font: 600 19px var(--body); fill: var(--ink); }
  .card .mini { fill: #EFE5DE; }
  .card .mini-dark { fill: var(--plum); }
  .card .mini-gold { fill: #E3C995; }
  .card .grow { transform-box: fill-box; transform-origin: left center; }
  .card.lit .grow { animation: growX 1.4s cubic-bezier(.2, .8, .2, 1) both; }
  @keyframes growX { from { transform: scaleX(0); } }
  .card .pop { transform-box: fill-box; transform-origin: center; }
  .card.lit .pop { animation: pop .6s cubic-bezier(.2, .8, .2, 1.3) both; }
  @keyframes pop { from { transform: scale(.4); opacity: 0; } }

  .node { cursor: pointer; color: var(--ink); }
  .node .disc { fill: var(--surface); stroke: #BCAB9F; stroke-width: 2; transition: fill .45s, stroke .45s; }
  .node .glyph { fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .node .glyph-t { fill: currentColor; stroke: none; font: 500 40px var(--display); }
  .node.gate { color: var(--gold); }
  .node.gate .disc { fill: var(--gold-pale); stroke: var(--gold-bright); }
  .node.done .disc { stroke: var(--gold-bright); }
  .node.active { color: var(--on-plum); }
  .node.active .disc { fill: var(--plum); stroke: var(--plum); }
  .node.gate.active .disc { fill: var(--gold); stroke: var(--gold); }
  .node .ring { fill: none; stroke: var(--gold-bright); stroke-width: 2; opacity: 0; transform-box: fill-box; transform-origin: center; }
  .node.active .ring { animation: ring 1.8s ease-out infinite; }
  @keyframes ring { 0% { opacity: .85; transform: scale(1); } 100% { opacity: 0; transform: scale(1.6); } }
  .node:hover .disc { stroke: var(--gold); }
  .particle { fill: var(--gold-bright); }

  .chip-bg { fill: var(--surface); stroke: var(--line); stroke-width: 1.2; }
  .chip-k { font: 600 11px var(--body); letter-spacing: .14em; fill: var(--gold); }
  .chip-t { font: 400 14px var(--body); fill: var(--ink); }
  #ledger-belt { animation: belt 40s linear infinite; }
  @keyframes belt { to { transform: translateX(var(--belt, -900px)); } }

  /* Bottom bar */
  .bottom { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 28px; align-items: center; padding: 10px var(--g) 16px; }
  .credit { font-size: 0.82rem; color: var(--text); white-space: nowrap; }
  .progress { display: grid; grid-template-columns: repeat(10, 1fr); gap: 6px; }
  .seg { all: unset; cursor: pointer; height: 5px; border-radius: 3px; background: var(--line-soft); position: relative; overflow: hidden; }
  .seg::after { content: ""; position: absolute; inset: 0; background: var(--gold-bright); transform: scaleX(0); transform-origin: left; }
  .seg.done::after, .seg.active::after { transform: scaleX(1); }
  .playing .seg.active::after { transform: scaleX(0); animation: fillSeg var(--dur, 5s) linear forwards; }
  @keyframes fillSeg { to { transform: scaleX(1); } }
  .controls { display: flex; gap: 8px; }
  .ctrl {
    all: unset; cursor: pointer; width: 42px; height: 42px; border-radius: 50%; display: grid; place-items: center;
    border: 1.5px solid var(--line); color: var(--ink); background: var(--surface); transition: border-color .2s, background .2s;
  }
  .ctrl:hover { border-color: var(--gold); background: var(--gold-pale); }
  .ctrl.play { background: var(--plum); border-color: var(--plum); color: var(--on-plum); }
  .ctrl svg { width: 15px; height: 15px; }

  @media (max-width: 980px) {
    body { overflow: auto; height: auto; display: block; }
    .legend { display: none; }
    .narr { grid-template-columns: 1fr; gap: 14px; }
    .stage { height: 460px; }
    .bottom { grid-template-columns: 1fr auto; }
    .credit { grid-column: 1 / -1; order: 2; white-space: normal; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>

<header>
  <div class="brand">
    <svg viewBox="0 0 30 30" fill="none" aria-hidden="true"><path d="M15 2.5 27.5 15 15 27.5 2.5 15Z" stroke="#8A6630" stroke-width="1.6"/><circle cx="15" cy="15" r="4.2" fill="#8A6630"/></svg>
    <div>
      <h1>The Content Atelier</h1>
      <p>How Wedding Industry Ads’ client conversations become ready-to-approve content</p>
    </div>
  </div>
  <div class="legend" aria-label="Legend">
    <span><i class="lg-step" aria-hidden="true"></i>The Atelier prepares</span>
    <span><i class="lg-gate" aria-hidden="true"></i>You decide</span>
  </div>
</header>

<section class="narr" aria-live="polite">
  <div class="num" id="cap-num">01<small>of 10</small></div>
  <div class="cap-text anim" id="cap-text"></div>
  <div class="pv anim" id="preview"></div>
</section>

<div class="stage">
  <svg id="diagram" viewBox="0 0 1440 610" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="dg-title">
    <title id="dg-title">Workflow: call sources flow through the Content Atelier's steps and three approval points, ending in an email, a carousel and three reel scripts.</title>
  </svg>
</div>

<div class="bottom" id="bottom">
  <span class="credit">Prepared by E2M Solutions for Wedding Industry Ads · Examples are illustrative</span>
  <div class="progress" id="progress" aria-label="Steps"></div>
  <div class="controls">
    <button class="ctrl" id="btn-prev" type="button" aria-label="Previous step"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M10.5 3 5.5 8l5 5" stroke="currentColor" stroke-width="1.9" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    <button class="ctrl play" id="btn-play" type="button" aria-label="Pause walkthrough"></button>
    <button class="ctrl" id="btn-next" type="button" aria-label="Next step"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M5.5 3l5 5-5 5" stroke="currentColor" stroke-width="1.9" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
  </div>
</div>

<script>
function initAtelier() {
  var NS = "http://www.w3.org/2000/svg";
  var svg = document.getElementById("diagram");
  var SPINE_Y = 215, R = 34;

  /* ---------- Layout (viewBox 1440 × 610) ---------- */
  var SRC_X = 14, SRC_W = 250, SRC_H = 128;
  var SOURCES = [
    { id: "src0", y: 140, title: "Zoom", sub: "Past 3 months of calls", detail: "Strategy calls and workshops", tag: "One-time backfill", icon: "cam" },
    { id: "src1", y: 330, title: "Fathom", sub: "Every new client call", detail: "Client calls and office hours", tag: "Ongoing", icon: "wave" },
    { id: "src2", y: 520, title: "Slack", sub: "Wins the team shares", detail: "Social Proof & Results + 2 more", tag: "3 channels", icon: "hash" }
  ];
  var NODES = [
    { id: "n1", x: 360, title: "Notice", sub: "Key moments", glyph: "quote" },
    { id: "n2", x: 470, title: "Shortlist", sub: "Weekly, 3–5", glyph: "list" },
    { id: "n3", x: 580, gate: true, title: "You pick the angle", sub: "~2 min, in Slack" },
    { id: "n4", x: 690, title: "Research", sub: "Proof + search", glyph: "search" },
    { id: "n5", x: 800, title: "Brief", sub: "One page", glyph: "doc" },
    { id: "n6", x: 910, gate: true, title: "You approve the brief", sub: "~5 min" },
    { id: "n7", x: 1020, title: "Create", sub: "The full pack", glyph: "pen" },
    { id: "n8", x: 1130, gate: true, title: "You sign off", sub: "Final read" }
  ];
  var OUT_X = 1200, OUT_W = 228, OUT_H = 88;
  var OUTPUTS = [
    { id: "out0", y: 114, title: "Email", sub: "The weekly note", icon: "mail", mini: "email" },
    { id: "out1", y: 223, title: "Carousel", sub: "7–10 slides", icon: "slides", mini: "carousel" },
    { id: "out2", y: 332, title: "Reel script 1", sub: "Script + caption", icon: "phone", mini: "reel" },
    { id: "out3", y: 441, title: "Reel script 2", sub: "Script + caption", icon: "phone", mini: "reel" },
    { id: "out4", y: 550, title: "Reel script 3", sub: "Script + caption", icon: "phone", mini: "reel" }
  ];
  var MOMENTS = [
    ["RESULT", "“Best month we’ve ever had”"],
    ["QUESTION", "How much should I spend on Meta?"],
    ["SOUNDBITE", "“10 weeks, and leads didn’t stop”"],
    ["WORKSHOP", "Defining your unique value"],
    ["PRAISE", "“You made this so easy”"],
    ["STORY", "From slow season to fully booked"],
    ["QUESTION", "Google or Meta first?"]
  ];
  var LEDGER_Y = 384, LOOP_Y = 522;

  function el(tag, attrs, parent, text) {
    var e = document.createElementNS(NS, tag);
    for (var k in attrs) e.setAttribute(k, attrs[k]);
    if (text != null) e.textContent = text;
    if (parent) parent.appendChild(e);
    return e;
  }
  function textWidth(str, cls) {
    var t = el("text", { class: cls, x: -9999, y: -9999 }, svg, str);
    var w = t.getComputedTextLength(); t.remove(); return w;
  }

  var defs = el("defs", {}, svg);
  var clip = el("clipPath", { id: "belt-clip" }, defs);
  el("rect", { x: 330, y: LEDGER_Y - 6, width: 820, height: 62 }, clip);
  var fadeGrad = el("linearGradient", { id: "belt-fade", x1: 0, x2: 1 }, defs);
  [["0", 1], [".06", 0], [".94", 0], ["1", 1]].forEach(function (s) { el("stop", { offset: s[0], "stop-color": "#fff", "stop-opacity": s[1] }, fadeGrad); });

  var gZone = el("g", {}, svg), gWires = el("g", {}, svg), gLedger = el("g", {}, svg),
      gParticles = el("g", {}, svg), gCards = el("g", {}, svg), gNodes = el("g", {}, svg);

  // Column headings
  el("text", { x: SRC_X + 2, y: 44, class: "cap" }, gZone, "WHAT IT LISTENS TO");
  el("text", { x: OUT_X + 2, y: 44, class: "cap" }, gZone, "ONE CONTENT PACK");
  // Atelier zone
  el("rect", { class: "zone", x: 300, y: 14, width: 880, height: 584, rx: 28 }, gZone);
  el("text", { x: 330, y: 50, class: "cap" }, gZone, "THE CONTENT ATELIER");

  // Wires
  var srcPaths = SOURCES.map(function (s, i) {
    var x0 = SRC_X + SRC_W, x1 = NODES[0].x - R;
    return el("path", { id: "pa" + i, class: "wire", d: "M" + x0 + " " + s.y + " C " + (x0 + 50) + " " + s.y + ", " + (x1 - 50) + " " + SPINE_Y + ", " + x1 + " " + SPINE_Y }, gWires);
  });
  el("path", { class: "wire", d: "M" + (NODES[0].x - R) + " " + SPINE_Y + " L " + (NODES[7].x + 30) + " " + SPINE_Y }, gWires);
  var outPaths = OUTPUTS.map(function (o, i) {
    var x0 = NODES[7].x + 30;
    return el("path", { id: "po" + i, class: "wire", d: "M" + x0 + " " + SPINE_Y + " C " + (x0 + 34) + " " + SPINE_Y + ", " + (OUT_X - 34) + " " + o.y + ", " + OUT_X + " " + o.y }, gWires);
  });
  el("path", { class: "tie", id: "tie-down", d: "M" + NODES[0].x + " " + (SPINE_Y + 98) + " L " + NODES[0].x + " " + (LEDGER_Y - 6) }, gWires);
  el("path", { class: "tie", id: "tie-up", d: "M" + NODES[1].x + " " + (LEDGER_Y - 6) + " L " + NODES[1].x + " " + (SPINE_Y + 98) }, gWires);

  // Learning loop: sign-off back to the shortlist
  var gx = NODES[7].x, sx = NODES[1].x;
  el("path", { class: "loop", id: "loop", d: "M" + gx + " " + (SPINE_Y + 50) + " L " + gx + " " + (LOOP_Y - 26) + " C " + gx + " " + LOOP_Y + ", " + (gx - 6) + " " + LOOP_Y + ", " + (gx - 32) + " " + LOOP_Y + " L " + (sx + 32) + " " + LOOP_Y + " C " + (sx + 6) + " " + LOOP_Y + ", " + sx + " " + LOOP_Y + ", " + sx + " " + (LOOP_Y - 26) + " L " + sx + " " + (LEDGER_Y + 66) }, gWires);
  el("path", { class: "arrow", id: "loop-arrow", d: "M" + (sx - 6) + " " + (LEDGER_Y + 70) + " L " + sx + " " + (LEDGER_Y + 60) + " L " + (sx + 6) + " " + (LEDGER_Y + 70) + " Z" }, gWires);
  el("text", { x: (sx + gx) / 2, y: LOOP_Y + 34, "text-anchor": "middle", class: "sub" }, gWires, "Your choices and edits sharpen next week’s shortlist");

  // Moments ledger
  el("text", { x: 500, y: LEDGER_Y - 16, class: "cap" }, gLedger, "MOMENTS LEDGER");
  el("text", { x: 652, y: LEDGER_Y - 16, class: "detail" }, gLedger, "Every moment keeps the exact words and a link to the recording");
  var belt = el("g", { id: "ledger-belt" }, el("g", { "clip-path": "url(#belt-clip)" }, gLedger));
  var bx = 340;
  for (var rep = 0; rep < 2; rep++) {
    MOMENTS.forEach(function (m) {
      var tw = Math.max(textWidth(m[1], "chip-t"), textWidth(m[0], "chip-k")) + 32;
      el("rect", { class: "chip-bg", x: bx, y: LEDGER_Y, width: tw, height: 50, rx: 12 }, belt);
      el("text", { class: "chip-k", x: bx + 16, y: LEDGER_Y + 20 }, belt, m[0]);
      el("text", { class: "chip-t", x: bx + 16, y: LEDGER_Y + 39 }, belt, m[1]);
      bx += tw + 12;
    });
    if (rep === 0) belt.style.setProperty("--belt", -(bx - 340) + "px");
  }
  el("rect", { x: 330, y: LEDGER_Y - 6, width: 820, height: 62, fill: "url(#belt-fade)", "pointer-events": "none" }, gLedger);

  function icon(kind, cx, cy, parent) {
    var g = el("g", { class: "ico" }, parent);
