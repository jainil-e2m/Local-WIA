<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f6f7fb" />
    <title>WIA · Client Knowledge Base</title>
    <meta name="description" content="A frontend preview of WIA's maintained client knowledge base: client context, call preparation and follow-through." />
    <link rel="icon" href="/logos/wia_favicon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <script id="fit-screen-js">
/* Fit to screen: between 1280px and 1920px wide, show the 1920px desktop layout shrunk to the window with CSS zoom,
   instead of the narrower adaptive layout. readme_changes.md technical note 54 explains each part. */
(function(){
  var DESIGN=1920,MIN=1280,KEY='wia-fit-screen-v1',W=window,de=document.documentElement,S=1,printing=false,enabled=true;
  try{enabled=localStorage.getItem(KEY)!=='off'}catch(e){}
  function desc(o,p){for(;o;o=Object.getPrototypeOf(o)){var d=Object.getOwnPropertyDescriptor(o,p);if(d)return d}}
  var iw=desc(W,'innerWidth').get,ih=desc(W,'innerHeight').get;
  function realW(){return iw.call(W)}

  // 1. Under zoom the browser reports rects, pointer coordinates, scroll offsets and the window size in screen pixels,
  //    but CSS lengths the page writes are page pixels. Convert every reading to page pixels so the page's own
  //    positioning code (menus, tooltips, drag and drop) keeps working as if the window were 1920px wide.
  function div(o,p,round){var d=desc(o,p);if(!d||!d.get)return;var g=d.get;
    Object.defineProperty(o,p,{configurable:true,enumerable:d.enumerable,get:function(){var v=g.call(this);return S===1?v:(round?Math.round(v/S):v/S)},set:d.set})}
  function scaleRect(r){return S===1?r:new DOMRect(r.x/S,r.y/S,r.width/S,r.height/S)}
  [Element.prototype,Range.prototype].forEach(function(P){
    var gb=P.getBoundingClientRect,gc=P.getClientRects;
    P.getBoundingClientRect=function(){return scaleRect(gb.call(this))};
    P.getClientRects=function(){var l=gc.call(this);if(S===1)return l;var a=[];for(var i=0;i<l.length;i++)a.push(scaleRect(l[i]));a.item=function(i){return a[i]||null};return a};
  });
  div(W,'innerWidth',true);div(W,'innerHeight',true);
  ['scrollX','scrollY','pageXOffset','pageYOffset'].forEach(function(p){div(W,p)});
  ['clientX','clientY','pageX','pageY','x','y'].forEach(function(p){div(MouseEvent.prototype,p)});
  if(W.Touch)['clientX','clientY','pageX','pageY'].forEach(function(p){div(Touch.prototype,p)});
  var cw=desc(Element.prototype,'clientWidth').get,ch=desc(Element.prototype,'clientHeight').get;
  Object.defineProperty(Element.prototype,'clientWidth',{configurable:true,get:function(){var v=cw.call(this);return this===de&&S!==1?Math.round(v/S):v}});
  Object.defineProperty(Element.prototype,'clientHeight',{configurable:true,get:function(){var v=ch.call(this);return this===de&&S!==1?Math.round(v/S):v}});
  ['elementFromPoint','elementsFromPoint'].forEach(function(m){var f=Document.prototype[m];Document.prototype[m]=function(x,y){return f.call(this,x*S,y*S)}});
  ['scrollTo','scroll','scrollBy'].forEach(function(m){var f=W[m];W[m]=function(a,b){
    if(S===1)return f.apply(W,arguments);
    if(a&&typeof a==='object'){var o={};for(var k in a)o[k]=a[k];if(o.left!=null)o.left*=S;if(o.top!=null)o.top*=S;return f.call(W,o)}
    return f.call(W,a*S,b*S)}});

  // 2. Width media queries still see the real window, so while zoomed each one is pinned to what it gives at 1920px.
  // 3. vh/vw lengths are shrunk by zoom too; multiply them by --fit-inv (1/zoom) so full-height parts still fill the window.
  //    A rule's media is swapped by re-inserting the rule: Chrome can leave a mediaText edit unapplied until its next frame.
  var media=[],seen=new WeakSet(),UNIT=/(-?\d*\.?\d+)((?:d|s|l)?v[hw])\b/g;
  function test(t,w){
    var parts=t.split(','),any=false;
    for(var i=0;i<parts.length;i++){
      var p=parts[i].trim().replace(/^(only\s+)?(screen|all)\s+and\s+/i,''),ok=true,
          rest=p.replace(/\(\s*(min-|max-)?width\s*(<=|>=|<|>|:)\s*([\d.]+)px\s*\)/gi,function(_,mm,op,n){n=+n;
            if(mm)op=mm.toLowerCase()==='min-'?'>=':'<=';
            if(!(op==='<='?w<=n:op==='>='?w>=n:op==='<'?w<n:w>n))ok=false;return ''});
      if(rest.replace(/\band\b/gi,'').trim())return null; // print, motion and other features: leave alone
      if(ok)any=true}
    return any}
  function setMedia(m,cond){
    if(m.r.media.mediaText===cond)return;
    var list=m.p.cssRules,i=0,inner='';
    while(i<list.length&&list[i]!==m.r)i++;
    if(i===list.length)return;
    for(var k=0;k<m.r.cssRules.length;k++)inner+=m.r.cssRules[k].cssText;
    m.p.deleteRule(i);m.p.insertRule('@media '+cond+'{'+inner+'}',i);m.r=list[i]}
  function walk(rules,parent){
    for(var i=0;i<rules.length;i++){var r=rules[i];
      if(r instanceof CSSMediaRule&&!(parent instanceof CSSMediaRule)&&/width/.test(r.media.mediaText)&&test(r.media.mediaText,DESIGN)!==null)
        media.push({p:parent,r:r,orig:r.media.mediaText});
      if(r.style&&!(W.CSSFontFaceRule&&r instanceof CSSFontFaceRule)){var s=r.style;
        for(var j=0;j<s.length;j++){var p=s[j],v=s.getPropertyValue(p);
          if(v.indexOf('url(')<0&&v.indexOf('--fit-inv')<0&&UNIT.test(v)){UNIT.lastIndex=0;
            s.setProperty(p,v.replace(UNIT,'calc($1$2 * var(--fit-inv))'),s.getPropertyPriority(p))}
          UNIT.lastIndex=0}}
      if(r.cssRules)walk(r.cssRules,r)}}
  function scan(){for(var i=0;i<document.styleSheets.length;i++){var sh=document.styleSheets[i];if(seen.has(sh))continue;
    try{walk(sh.cssRules,sh);seen.add(sh)}catch(e){}}}

  // 4. The on/off toggle sits first in the header's tool row (before the bell). The app redraws the header, so put it
  //    back whenever it goes missing.
  var btn=null;
  function place(){
    var tools=btn&&document.querySelector('.utility-header .header-tools');
    if(tools&&btn.parentNode!==tools)tools.insertBefore(btn,tools.firstChild)}
  function apply(){
    scan();
    var rw=realW(),inRange=rw>=MIN&&rw<DESIGN,on=enabled&&inRange&&!printing;
    S=on?rw/DESIGN:1;
    media.forEach(function(m){setMedia(m,on?(test(m.orig,DESIGN)?'all':'not all'):m.orig)});
    de.style.zoom=on?String(S):'';
    de.style.setProperty('--fit-inv',String(1/S));
    de.classList.toggle('fit-on',on);de.classList.toggle('fit-in-range',inRange);
    if(btn){btn.setAttribute('aria-pressed',String(on));
      btn.title=on?'Fit to screen is on: the full desktop layout, scaled to this window. Click for the regular layout.'
                  :'Fit to screen is off. Click to show the full desktop layout scaled to this window.'}
    place()}
  var queued=false;
  function schedule(){if(queued)return;queued=true;setTimeout(function(){queued=false;apply()})}

  apply();
  W.addEventListener('resize',schedule);
  W.addEventListener('beforeprint',function(){printing=true;apply()});
  W.addEventListener('afterprint',function(){printing=false;apply()});
  new MutationObserver(schedule).observe(document.head,{childList:true});
  document.addEventListener('DOMContentLoaded',function(){
    btn=document.createElement('button');btn.type='button';btn.className='icon-button fit-toggle';btn.setAttribute('aria-label','Fit to screen');
    btn.innerHTML='<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 3H5a2 2 0 0 0-2 2v3M21 8V5a2 2 0 0 0-2-2h-3M3 16v3a2 2 0 0 0 2 2h3M16 21h3a2 2 0 0 0 2-2v-3"/></svg>';
    btn.addEventListener('click',function(){enabled=!enabled;try{localStorage.setItem(KEY,enabled?'on':'off')}catch(e){}apply()});
    apply();
    var root=document.getElementById('root'),q=false;
    new MutationObserver(function(){if(q||(btn.parentNode&&btn.isConnected&&btn.parentNode.classList.contains('header-tools')))return;
      q=true;setTimeout(function(){q=false;place()})}).observe(root||document.body,{childList:true,subtree:true})});
})();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
