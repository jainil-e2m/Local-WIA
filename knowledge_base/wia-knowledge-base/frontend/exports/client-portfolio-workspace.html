<!--
WIA CLIENT WORKSPACE — DAILY-USE SAAS DESIGN EXPLORATION
A separate standalone prototype; the readable export and app source are unchanged.

DESIGN DECISIONS
1. A table is the default portfolio so accounts can be compared in aligned columns.
2. Identity, account manager, status, open work and next interaction remain visible.
3. Summary counts are derived from the shared fictional records and open filtered views.
4. Search, manager/service filters, density and layout support repeated use; preferences persist locally.
5. Returning to the portfolio preserves the user's selected view and filters.
6. The client workspace uses compact headers, sticky section navigation and direct client switching.
7. This Week keeps the agreed order: priorities; actions/deliverables; meetings; communication.
8. Notes, evidence, deliverable details and longer recaps use progressive disclosure.
9. Neutral surfaces, sans-serif typography and restrained semantic color replace decorative styling.

DATA AND BEHAVIOR
All clients, managers, sources and financial records are fictional review data.
The weekly window is anchored to DEMO_DATE (9 Oct 2026), not the machine clock.
Actions and preferences use separate localStorage keys from the original export.
No source writes, live sync, authentication or AI are implemented. Offline, single-file HTML.

EDITING
#workspace-styles controls appearance. #portfolio-runtime contains interaction and renderers.
#portfolio-data contains the editable records. #portfolio-icons and #portfolio-assets are embedded assets.
-->

      layout: ['table','grid'].includes(value.layout) ? value.layout : 'table',

function saveWorkspacePreferences() {
  const { layout, density, sort, manager, service, filter } = state;
  try { localStorage.setItem('wia-workspace-preferences-v1', JSON.stringify({layout,density,sort,manager,service,filter})); } catch {}
}

function person(name, small = false) {
  const initials = (name || '?').split(/\s+/).slice(0,2).map(word=>word[0]).join('');
  return `<span class="person ${small ? 'person-small' : ''}"><span class="person-dot" aria-hidden="true">${escapeHtml(initials)}</span><span>${escapeHtml(name || 'Unassigned')}</span></span>`;
}

function nativeSelect(label, field, value, options, extra = '') {
  return `<label class="select-field"><span class="sr-only">${label}</span><select aria-label="${label}" data-change="${field}" ${extra}>${options.map(([id,text])=>`<option value="${escapeHtml(id)}" ${id===value?'selected':''}>${escapeHtml(text)}</option>`).join('')}</select></label>`;
}

function portfolioMatches(client, filter = state.filter) {
  const open = clientActions(client).filter(isOutstanding);
  return filter === 'all' || filter === 'watch' && client.health === 'Needs attention'
    || filter === 'overdue' && open.some(isOverdue)
    || filter === 'calls' && !!nextClientCall(client) && inWeek(nextClientCall(client).date)
    || filter === 'waiting' && open.some(action=>action.side==='Client');
}

function renderPortfolioTable(clients) {
  return `<div class="portfolio-table-wrap"><table class="portfolio-table"><thead><tr><th scope="col">Client</th><th scope="col" class="service-col">Engagement</th><th scope="col">Managed by</th><th scope="col">Status</th><th scope="col">Open work</th><th scope="col">Next meeting</th><th scope="col" class="last-touch-col">Last touch</th><th scope="col"><span class="sr-only">Open record</span></th></tr></thead><tbody>${clients.map(client=>{
    const call=nextClientCall(client),open=clientActions(client).filter(isOutstanding),late=open.filter(isOverdue).length;
    return `<tr><td><button class="table-client-name" data-action="client" data-id="${client.id}">${avatar(client,true)}<span><strong>${escapeHtml(client.name)}</strong><small>${escapeHtml(client.category)} · ${escapeHtml(client.location)}</small></span></button></td>
      <td class="service-col"><strong class="cell-label">${escapeHtml(client.service)}</strong><small class="cell-secondary">${client.type==='retainer'?'Retainer':'Programme'}</small></td><td>${person(client.manager,true)}</td>
      <td>${badge(client.health,client.health==='Needs attention'?'amber':client.health==='On track'?'green':'blue')}</td>
      <td><button class="work-count" data-action="tab" data-id="${client.id}" data-tab="commitments"><strong>${open.length}</strong> open${late?`<small>${late} overdue</small>`:'<small class="muted">No overdue work</small>'}</button></td>
      <td>${call?`<button class="table-meeting" data-action="call" data-id="${call.id}"><strong>${call.date===DEMO_DATE?'Today':dateLabel(call.date)}</strong><small>${timeLabel(call.time)} IST · ${escapeHtml(call.host)}</small></button>`:'<span class="muted">Not scheduled</span>'}</td>
      <td class="last-touch-col"><span class="cell-secondary">${dateLabel(client.lastTouch)}</span></td><td><button class="row-open icon-button" aria-label="Open ${escapeHtml(client.name)}" data-action="client" data-id="${client.id}">${icon('ChevronRight',17)}</button></td></tr>`;
  }).join('')}</tbody></table></div>`;
}

function showFocus(clientId) {
  const client=clientById(clientId),focus=DATA.WEEKLY_FOCUS[clientId];
  showDialog('Weekly focus',`<h3 class="drawer-action-title">${escapeHtml(client.focus)}</h3><p class="body-copy">Suggested focus · review with the account team.</p>${badge(focus.label,focus.tone,false)}<p class="body-copy">${escapeHtml(focus.detail)}</p><div class="source-section">${sourceLink(focus.sourceId,'Supporting context')}</div>`,client.name);
}

function showDeliverable(index) {
  const item=DATA.WEEKLY_DELIVERABLES[Number(index)];if(!item)return;
  const action=state.actions.find(a=>a.id===item.actionId),client=clientById(item.clientId);
  showDialog('Deliverable details',`<h3 class="drawer-action-title">${escapeHtml(item.title)}</h3>${badge(item.stage,item.deliveredAt?'green':'amber',false)}<p class="body-copy">${escapeHtml(item.note)}</p>${detailsList([['Owner',escapeHtml(item.owner)],['Due',action?dateLabel(action.due):item.due?dateLabel(item.due):'Not recorded'],['Delivery update',item.deliveredAt?dateLabel(item.deliveredAt):'Not recorded'],['Artifact',escapeHtml(item.artifactNote)]])}<div class="source-section">${sourceLink(item.sourceId,'Delivery evidence')}</div>${action?`<button class="button button-outline full-width" data-action="action-details" data-id="${action.id}">Linked action · ${escapeHtml(action.status)}${icon('ArrowRight',14)}</button>`:''}<p class="muted body-copy">Completing a linked action does not establish delivery or client approval.</p>`,client.name);
}

function handleWorkspaceChange(event) {
  const field=event.target.dataset.change;if(!field)return;
  if(field==='client-switch'){const tab=getRoute().tab;openClient(event.target.value,tab);return;}
  if(['manager','service','sort'].includes(field)){state[field]=event.target.value;saveWorkspacePreferences();updatePortfolioCards();}
}


/* ============================================================================
   WIA CLIENT PORTFOLIO — PLAIN JAVASCRIPT
   No framework, package imports, network requests, or build step are needed.

   EDITING MAP
   • Colours, spacing and responsive layouts: #portfolio-styles in <head>.
   • Client copy and records: #portfolio-data near the end of this file.
   • Card structure: renderClientCard(). Tab structure: renderClientDetail().
   • Tab content: renderThisWeek(), renderProfile(), renderHistory(), renderBrief(),
     renderCommitments(), renderMeetings(), renderInvoices(), renderAttendance().
   • Interaction wiring: handleClick(), handleInput(), handleKeydown().
   • Images, fonts and SVGs are embedded separately after the readable code.
   ============================================================================ */

'use strict';

const DATA = JSON.parse(document.getElementById('portfolio-data').textContent);
const ASSETS = JSON.parse(document.getElementById('portfolio-assets').textContent);
const ICONS = JSON.parse(document.getElementById('portfolio-icons').textContent);
const { CLIENTS, EVIDENCE, INITIAL_ACTIONS, CALLS, INVOICES, EVENTS, TEAM, DEMO_DATE } = DATA;
const STORAGE_KEY = 'wia-workspace-actions-v1';
const TAB_LABELS = {
  week: 'This Week', profile: 'Client profile', history: 'Engagement history',
  brief: 'Handover brief', commitments: 'Commitments', meetings: 'Meetings',
  money: 'Invoices & terms', attendance: 'Attendance'
};

const state = {
  query: '', filter: 'all', layout: 'table', sort: 'attention', manager: 'all', service: 'all', density: 'comfortable',
  ...loadWorkspacePreferences(),
  historyMode: 'feed', historyLane: 'all', commitmentSide: 'all', weekActions: 'attention', weekChannel: 'all',
  collapsed: false, mobileOpen: false, actions: loadActions(),
  dialog: null, select: null, calendar: null, toastTimer: null
};

// 1. DATA, FORMATTING AND SHARED HTML PRIMITIVES

function escapeHtml(value = '') {
  return String(value).replace(/[&<>"']/g, character => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  })[character]);
}

function icon(name, size = 14, strokeWidth = 2) {
  const svg = ICONS[name] || ICONS.FileText;
  return svg.replace(/width="\d+"/, `width="${size}"`)
    .replace(/height="\d+"/, `height="${size}"`)
    .replace(/stroke-width="[^"]+"/, `stroke-width="${strokeWidth}"`);
}

function dateLabel(date, options = { month: 'short', day: 'numeric' }) {
  return new Intl.DateTimeFormat('en-IN', { ...options, timeZone: 'Asia/Kolkata' })
    .format(new Date(`${date}T12:00:00+05:30`));
}

function timeLabel(time) {
  const [hour, minute] = time.split(':').map(Number);
  return `${hour % 12 || 12}:${String(minute).padStart(2, '0')} ${hour >= 12 ? 'PM' : 'AM'}`;
}

function money(amount) {
  return new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD', maximumFractionDigits: 0 }).format(amount);
}

function clientById(id) { return CLIENTS.find(client => client.id === id); }
function sourceById(id) { return EVIDENCE.find(source => source.id === id); }
function isOutstanding(action) { return ['Open', 'In progress'].includes(action.status); }
function isOverdue(action) { return isOutstanding(action) && action.due < DEMO_DATE; }
function clientActions(client) { return state.actions.filter(action => action.clientId === client.id); }

function loadActions() {
  try {
    const saved = JSON.parse(localStorage.getItem(STORAGE_KEY));
    if (Array.isArray(saved) && saved.length && saved.every(action =>
      action && CLIENTS.some(client => client.id === action.clientId) &&
      EVIDENCE.some(source => source.id === action.sourceId) &&
      typeof action.title === 'string' && typeof action.owner === 'string' &&
      typeof action.note === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(action.due) &&
      ['Open', 'In progress', 'Done', 'Verified'].includes(action.status) &&
      ['WIA', 'Client'].includes(action.side) && typeof action.acknowledged === 'boolean'
    )) return saved;
  } catch { /* The HTML also works when file:// storage is unavailable. */ }
  return structuredClone(INITIAL_ACTIONS);
}

function badge(text, tone = 'neutral', dot = true) {
  return `<span class="badge badge-${tone}">${dot ? '<i aria-hidden="true"></i>' : ''}${escapeHtml(text)}</span>`;
}

function avatar(client, small = false) {
  return `<span class="client-avatar ${small ? 'small' : ''} avatar-${client.tone}" aria-hidden="true">${client.initials}</span>`;
}

function sourceIcon(kind, size = 14) {
  return icon(['Zoom', 'Fathom'].includes(kind) ? 'Video' : kind === 'Gmail' ? 'Mail' : kind === 'Slack' ? 'MessageSquare' : 'FileText', size, 1.7);
}

function sourceLink(id, label) {
  const source = sourceById(id);
  if (!source) return '<span class="muted small-text">Source unavailable</span>';
  return `<button class="source-link source-${source.kind.toLowerCase()}" data-action="evidence" data-id="${source.id}">
    ${sourceIcon(source.kind)}${escapeHtml(label || source.kind)}${icon('ArrowUpRight', 11)}
  </button>`;
}

function panel(title, content, eyebrow = '', action = '', className = '') {
  return `<section class="panel ${className}">
    ${title ? `<div class="panel-heading"><div>${eyebrow ? `<p class="eyebrow">${eyebrow}</p>` : ''}<h2>${title}</h2></div>${action}</div>` : ''}
    ${content}
  </section>`;
}

function empty(title = 'Nothing here yet', description = 'Try a different search or filter.') {
  return `<div class="empty-state">${icon('Search', 24)}<h3>${title}</h3><p>${description}</p></div>`;
}

function coverage(value) {
  return `<div class="coverage"><div class="coverage-track"><span style="width:${value}%"></span></div><span>${value}%</span></div>`;
}

function sparkline(client) {
  const maximum = Math.max(...client.activity, 1);
  const points = client.activity.map((value, index) => `${index * (100 / (client.activity.length - 1))},${26 - value / maximum * 21}`).join(' ');
  return `<svg class="sparkline sparkline-${client.tone}" viewBox="0 0 104 30" role="img" aria-label="Sample communication activity over the past twelve weeks">
    <polyline fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" points="${points}"></polyline>
    <circle cx="100" cy="${26 - client.activity.at(-1) / maximum * 21}" r="2.5" fill="currentColor"></circle>
  </svg>`;
}

function segmented(label, action, selected, options) {
  return `<div class="segmented" role="group" aria-label="${label}">${options.map(([id, text, count]) => `
    <button class="${selected === id ? 'selected' : ''}" aria-pressed="${selected === id}" data-action="${action}" data-value="${id}">
      ${text}${count === undefined ? '' : `<span>${count}</span>`}
    </button>`).join('')}</div>`;
}

function selectControl(label, key, value, options, id = '') {
  const selected = options.find(option => option[0] === value);
  return `<button ${id ? `id="${id}"` : ''} type="button" role="combobox" class="atelier-select-trigger"
    aria-label="${label}" aria-haspopup="listbox" aria-expanded="false" data-action="select" data-select="${key}"
    data-options="${escapeHtml(JSON.stringify(options))}" data-value="${escapeHtml(value)}">
    <span>${escapeHtml(selected?.[1] || value)}</span>${icon('ChevronDown', 14)}
  </button>`;
}

function detailsList(entries) {
  return `<dl class="detail-list">${entries.map(([label, value]) => `<div><dt>${label}</dt><dd>${value}</dd></div>`).join('')}</dl>`;
}

// 2. APP SHELL, SIDEBAR AND HASH NAVIGATION

function getRoute() {
  const [view, id, requestedTab] = location.hash.slice(1).split('/');
  if (view === 'calls' && CALLS.some(call => call.id === id)) return { view: 'calls', id };
  const client = clientById(id);
  const allowed = client && (requestedTab !== 'attendance' || client.type === 'accelerator');
  return { view: 'clients', client: client || null, tab: allowed && TAB_LABELS[requestedTab] ? requestedTab : 'week' };
}

function openClient(id, tab = 'week') { navigate(`clients/${id}/${tab}`); }
function openCall(id) { navigate(`calls/${id}`); }
function navigate(hash) {
  closeDialog(); closeSelect(false); closeCalendar(false);
  state.mobileOpen = false; syncSidebar();
  if (location.hash === `#${hash}`) renderPage(); else location.hash = hash;
}

function renderShell() {
  const navigation = [['Overview','House'],['Client portfolio','Users'],['Action register','ListChecks'],['Call preparation','CalendarDays'],['Health & sentiment','HeartHandshake'],['Invoices & contracts','ReceiptText']];
  document.getElementById('app').innerHTML = `<div class="app-shell">
    <a class="skip-link" href="#main-content" data-action="skip">Skip to content</a>
    <aside class="sidebar"><div class="sidebar-brand"><img src="${ASSETS.logo}" alt="Wedding Industry Ads"><div><strong>WIA</strong><span>Client workspace</span></div><button class="icon-button mobile-close" aria-label="Close navigation" data-action="close-navigation">${icon('X',18)}</button></div>
      <div class="workspace-label"><span class="workspace-mark">W</span><div><strong>Wedding Industry Ads</strong><span>Team workspace</span></div></div>
      <nav aria-label="Main navigation"><p class="nav-label">WORKSPACE</p>${navigation.map(([label,symbol])=>`<button class="nav-item ${label==='Client portfolio'?'active':''}" ${label==='Client portfolio'?'data-action="portfolio" aria-current="page"':'disabled aria-disabled="true"'} title="${label}" ${label==='Action register'?'data-outstanding-count':''}>${icon(symbol,18,1.8)}<span>${label}</span>${label==='Action register'?`<b>${state.actions.filter(isOutstanding).length}</b>`:''}</button>`).join('')}
      <div class="nav-divider"></div><p class="nav-label">RESOURCES</p><button class="nav-item" data-action="sources" title="Source library">${icon('BookOpen',18)}<span>Source library</span></button><button class="nav-item" disabled title="Connections">${icon('Plug',18)}<span>Connections</span></button></nav>
      <div class="sidebar-bottom"><div class="sidebar-preview">Design preview<span>Fictional client data</span></div><div class="sidebar-person"><div class="person-avatar">WH</div><div><strong>Whitney Hodges</strong><small>WIA team</small></div><button class="icon-button collapse-button" aria-label="Collapse sidebar" data-action="collapse">${icon('PanelLeftClose',17)}</button></div></div>
    </aside><div class="workspace"><header class="utility-header"><div class="header-leading"><button class="icon-button mobile-menu" aria-label="Open navigation" aria-expanded="false" data-action="open-navigation">${icon('Menu',20)}</button><div id="header-title"></div></div>
      <div class="header-tools"><button class="header-search" aria-label="Search the workspace" data-action="search">${icon('Search',16)}<span>Search workspace</span><kbd>Ctrl K</kbd></button><button class="icon-button notification-button" aria-label="Open attention items" data-action="alerts">${icon('Bell',18)}<i></i></button><button class="header-user" aria-label="About the Whitney preview account" data-action="about">WH</button></div></header>
      <main id="main-content" tabindex="-1"></main><footer class="workspace-footer"><span>WIA client workspace</span><span>Preview data · 9 Oct 2026</span></footer></div></div><div id="dialog-host"></div><div id="toast-host" aria-live="polite"></div>`;
}

function syncSidebar() {
  document.querySelector('.app-shell').classList.toggle('sidebar-is-collapsed', state.collapsed);
  const sidebar = document.querySelector('.sidebar');
  sidebar.classList.toggle('collapsed', state.collapsed);
  sidebar.classList.toggle('mobile-open', state.mobileOpen);
  const collapse = document.querySelector('[data-action="collapse"]');
  collapse.setAttribute('aria-label', state.collapsed ? 'Expand sidebar' : 'Collapse sidebar');
  collapse.innerHTML = icon(state.collapsed ? 'Menu' : 'PanelLeftClose', 17);
  document.querySelector('[data-action="open-navigation"]').setAttribute('aria-expanded', state.mobileOpen);
  document.querySelector('.mobile-scrim')?.remove();
  if (state.mobileOpen) {
    const scrim = document.createElement('button');
    scrim.className = 'mobile-scrim';
    scrim.dataset.action = 'close-navigation';
    scrim.setAttribute('aria-label', 'Close navigation');
    sidebar.before(scrim);
  }
}

function renderHeader(route) {
  document.title = `${route.client?.name || 'Client portfolio'} · WIA Workspace`;
  document.getElementById('header-title').innerHTML = `<nav class="header-breadcrumbs" aria-label="Breadcrumb"><a href="#clients">Workspace</a>${icon('ChevronRight',13)}<a href="#clients">Client portfolio</a>${route.client ? `${icon('ChevronRight',13)}${nativeSelect('Switch client','client-switch',route.client.id,CLIENTS.map(c=>[c.id,c.name]))}` : route.view==='calls' ? `${icon('ChevronRight',13)}<span>Meeting prep</span>` : ''}</nav>`;
}

function renderPage() {
  const route=getRoute(); renderHeader(route);
  document.body.dataset.density=state.density;
  document.getElementById('main-content').innerHTML = route.view==='calls' ? renderCallBrief(CALLS.find(call=>call.id===route.id)) : route.client ? renderClientDetail(route.client,route.tab) : renderPortfolio();
  if(!route.client && route.view==='clients') updatePortfolioCards();
  document.querySelector('[data-outstanding-count] b').textContent=state.actions.filter(isOutstanding).length;
  document.querySelector('.notification-button i').hidden=!state.actions.some(isOverdue);
}

function renderPortfolio() {
  const attention=CLIENTS.filter(c=>c.health==='Needs attention').length;
  const overdue=state.actions.filter(isOverdue).length;
  const meetings=CLIENTS.filter(c=>portfolioMatches(c,'calls')).length;
  const metrics=[['all',CLIENTS.length,'Active clients','Across all service engagements','Users'],['watch',attention,'Need attention','Recorded engagement assessments','HeartHandshake'],['overdue',overdue,'Overdue actions','Across active client accounts','Clock3'],['calls',meetings,'Meetings this week','Upcoming in the sample calendar','CalendarDays']];
  return `<div class="view portfolio-view"><div class="page-heading"><div><div class="page-overline">CLIENT OPERATIONS</div><h1>Client portfolio <span class="title-count">${CLIENTS.length}</span></h1><p>Your accounts, priorities and next conversations.</p></div><div class="heading-actions"><span class="snapshot-label">${icon('Clock3',14)}Snapshot · 9 Oct 2026</span><button class="button button-outline" data-action="sources">${icon('BookOpen',15)}Source library</button></div></div>
    <div class="portfolio-metrics" aria-label="Portfolio overview">${metrics.map(([value,count,label,note,symbol])=>`<button class="portfolio-metric" data-action="portfolio-filter" data-value="${value}" aria-label="${label}: ${count}"><span class="metric-label">${label}${icon(symbol,16)}</span><strong>${count}</strong><span class="metric-note">${note}</span></button>`).join('')}</div>
    <section class="portfolio-surface" aria-label="Client accounts"><div class="portfolio-view-tabs" role="group" aria-label="Portfolio views">${[['all','All clients'],['watch','Needs attention'],['waiting','Awaiting client'],['calls','Meetings this week']].map(([value,label])=>`<button class="${state.filter===value?'selected':''}" aria-pressed="${state.filter===value}" data-action="portfolio-filter" data-value="${value}">${label}<span>${CLIENTS.filter(c=>portfolioMatches(c,value)).length}</span></button>`).join('')}${state.filter==='overdue'?'<button class="selected" aria-pressed="true" data-action="portfolio-filter" data-value="overdue">Overdue work</button>':''}</div>
    <div class="portfolio-toolbar"><label class="search-field">${icon('Search',16)}<input aria-label="Search clients" placeholder="Search clients or managers…" value="${escapeHtml(state.query)}" data-input="portfolio-search"><button class="icon-button" aria-label="Clear search clients" data-action="clear-search" ${state.query?'':'hidden'}>${icon('X',14)}</button></label>
      <div class="portfolio-filter-controls">${nativeSelect('Filter by manager','manager',state.manager,[['all','All managers'],...([...new Set(CLIENTS.map(c=>c.manager))].map(name=>[name,name]))])}${nativeSelect('Filter by service','service',state.service,[['all','All services'],['retainer','Retainers'],['accelerator','Accelerators']])}${nativeSelect('Sort clients','sort',state.sort,[['attention','Attention first'],['name','Client name'],['meeting','Next meeting']])}</div>
      <div class="table-controls"><button class="icon-button density-button" aria-label="${state.density==='compact'?'Comfortable rows':'Compact rows'}" title="${state.density==='compact'?'Comfortable rows':'Compact rows'}" data-action="density">${icon('ListChecks',16)}</button><div class="layout-toggle" role="group" aria-label="Portfolio layout"><button aria-label="Table view" aria-pressed="${state.layout==='table'}" class="${state.layout==='table'?'selected':''}" data-action="layout" data-value="table">${icon('List',16)}</button><button aria-label="Card view" aria-pressed="${state.layout==='grid'}" class="${state.layout==='grid'?'selected':''}" data-action="layout" data-value="grid">${icon('LayoutGrid',16)}</button></div></div>
    </div><div id="portfolio-results"></div><div class="portfolio-table-footer"><span id="portfolio-result-count" role="status" aria-live="polite"></span><span>Managers and assessments are sample records.</span><button class="text-button" data-action="reset-filters">Reset filters</button></div></section>
  </div>`;
}

function updatePortfolioCards() {
  const needle=state.query.toLowerCase().trim();
  const clients=CLIENTS.filter(c=>`${c.name} ${c.contact} ${c.service} ${c.location} ${c.manager||''}`.toLowerCase().includes(needle) && portfolioMatches(c) && (state.manager==='all'||c.manager===state.manager) && (state.service==='all'||c.type===state.service))
    .sort((a,b)=>state.sort==='name'?a.name.localeCompare(b.name):state.sort==='meeting'?(nextClientCall(a)?.date||'9999').localeCompare(nextClientCall(b)?.date||'9999'):Number(b.health==='Needs attention')-Number(a.health==='Needs attention')||a.name.localeCompare(b.name));
  const host=document.getElementById('portfolio-results');if(!host)return;
  host.innerHTML=clients.length ? state.layout==='grid'?`<div class="client-grid">${clients.map(renderClientCard).join('')}</div>`:renderPortfolioTable(clients)+`<div class="mobile-client-grid">${clients.map(renderClientCard).join('')}</div>` : `<div class="empty-state">${icon('Search',24)}<h3>No matching clients</h3><p>Try a different search, manager or service.</p><button class="button button-outline" data-action="reset-filters">Clear filters</button></div>`;
  document.getElementById('portfolio-result-count').textContent=`${clients.length} of ${CLIENTS.length} clients`;
  document.querySelector('[data-action="clear-search"]').hidden=!state.query;
}

function clientManager(client, compact = false) {
  const name = client.manager?.trim();
  return `<span class="client-manager ${compact ? 'client-manager-compact' : ''}">${icon('UserRound', compact ? 12 : 14)}<span class="client-manager-label">Managed by</span><strong>${escapeHtml(name || 'Not assigned')}</strong></span>`;
}

function renderClientCard(client) {
  const call=nextClientCall(client),open=clientActions(client).filter(isOutstanding),late=open.filter(isOverdue).length;
  return `<article class="client-card" data-client-id="${client.id}"><div class="client-card-top">${avatar(client,true)}${badge(client.health,client.health==='Needs attention'?'amber':client.health==='On track'?'green':'blue')}</div><button class="client-name-link" data-action="client" data-id="${client.id}"><h2>${escapeHtml(client.name)}</h2>${icon('ArrowUpRight',16)}</button><p class="client-card-meta">${escapeHtml(client.service)} · ${escapeHtml(client.location)}</p><div class="card-manager"><span>Managed by</span>${person(client.manager,true)}</div><p class="card-focus">${escapeHtml(client.focus)}</p><div class="card-work"><button data-action="tab" data-id="${client.id}" data-tab="commitments">${open.length} open actions${late?`<span>${late} overdue</span>`:''}</button><span>${call?`${dateLabel(call.date)} · ${timeLabel(call.time)}`:'No meeting scheduled'}</span></div></article>`;
}

function renderClientDetail(client,tab) {
  const call=nextClientCall(client),open=clientActions(client).filter(isOutstanding);
  const tabs=Object.entries(TAB_LABELS).filter(([id])=>id!=='attendance'||client.type==='accelerator');
  const renderers={week:renderThisWeek,profile:renderProfile,history:renderHistory,brief:renderBrief,commitments:renderCommitments,meetings:renderMeetings,money:renderInvoices,attendance:renderAttendance};
  return `<div class="view client-detail"><button class="back-link" data-action="portfolio">${icon('ArrowLeft',14)}All clients</button><div class="client-detail-heading">${avatar(client)}<div class="client-heading-text"><div class="client-title-line"><h1>${escapeHtml(client.name)}</h1>${badge(client.health,client.health==='Needs attention'?'amber':client.health==='On track'?'green':'blue')}</div><div class="client-identity"><span>${escapeHtml(client.service)}</span><span>${escapeHtml(client.location)}</span><span class="record-manager">Managed by ${person(client.manager,true)}</span></div></div><div class="client-detail-actions"><button class="button button-outline" data-action="sources" data-id="${client.id}">${icon('BookOpen',15)}Sources</button>${call?`<button class="button button-primary" data-action="call" data-id="${call.id}">${icon('CalendarDays',15)}Meeting prep</button>`:''}</div></div>
    <div class="client-tabs" role="group" aria-label="Client record sections">${tabs.map(([id,label])=>`<button class="${tab===id?'active':''}" aria-pressed="${tab===id}" data-action="tab" data-id="${client.id}" data-tab="${id}">${label}${id==='commitments'?`<span>${open.length}</span>`:''}</button>`).join('')}</div><div class="client-tab-content">${renderers[tab](client)}</div></div>`;
}

function weekWindow() {
  const day = new Date(`${DEMO_DATE}T12:00:00Z`);
  day.setUTCDate(day.getUTCDate() - (day.getUTCDay() + 6) % 7);
  const start = day.toISOString().slice(0, 10);
  day.setUTCDate(day.getUTCDate() + 6);
  return { start, end: day.toISOString().slice(0, 10) };
}
function inWeek(date) { const { start, end } = weekWindow(); return !!date && date >= start && date <= end; }
function weekEmpty(title, copy) { return `<div class="week-empty"><h3>${escapeHtml(title)}</h3><p>${escapeHtml(copy)}</p></div>`; }
function nextClientCall(client) {
  return CALLS.filter(call => call.clientId === client.id && call.date >= DEMO_DATE)
    .sort((a, b) => `${a.date}T${a.time}`.localeCompare(`${b.date}T${b.time}`))[0];
}
function completedDate(action) {
  if (isOutstanding(action)) return null;
  if (action.completedAt) return action.completedAt;
  const initial = INITIAL_ACTIONS.find(item => item.id === action.id);
  return initial?.status === action.status ? initial.completedAt : null;
}
function weeklyActionSets(client) {
  const rows = clientActions(client), open = rows.filter(isOutstanding);
  return {
    attention: open.filter(action => isOverdue(action) || inWeek(action.due)).sort((a,b) => a.due.localeCompare(b.due)),
    client: open.filter(action => action.side === 'Client').sort((a,b) => a.due.localeCompare(b.due)),
    completed: rows.filter(action => !isOutstanding(action) && inWeek(completedDate(action)))
  };
}
function renderWeeklyActions(client) {
  const sets=weeklyActionSets(client),rows=sets[state.weekActions]||sets.attention;
  const next=clientActions(client).filter(a=>isOutstanding(a)&&a.due>weekWindow().end);
  const filters=segmented('Weekly action items','week-actions',state.weekActions,[['attention','Due & overdue',sets.attention.length],['client','Awaiting client',sets.client.length],['completed','Completed',sets.completed.length]]);
  return filters+(rows.length?`<div class="weekly-task-table"><div class="task-column-head"><span>Action / owner</span><span>Due date</span><span>Status</span></div>${rows.map(action=>{
    const open=isOutstanding(action),date=open?action.due:completedDate(action);
    return `<div class="week-task" data-action-row="${action.id}"><div class="task-main"><button class="action-checkbox ${open?'':'checked'}" aria-label="${open?'Mark':'Reopen'} ${escapeHtml(action.title)}${open?' done':''}" data-action="toggle-action" data-id="${action.id}">${open?'':icon('Check',12)}</button><div><button class="week-task-title" data-action="action-details" data-id="${action.id}">${escapeHtml(action.title)}</button><div class="task-owner">${person(action.owner,true)}<span>${action.side==='Client'?'Client dependency':'WIA'}${!action.acknowledged&&open?' · Unacknowledged':''}</span></div></div></div><span class="task-date ${isOverdue(action)?'text-amber':''}">${date?dateLabel(date):'Not recorded'}${isOverdue(action)?'<small>Overdue</small>':!open?'<small>Completed</small>':''}</span><div class="task-status">${badge(action.status,action.status==='Verified'?'green':action.status==='Done'?'blue':action.status==='In progress'?'blue':'neutral',false)}<button class="icon-button" aria-label="Details for ${escapeHtml(action.title)}" data-action="action-details" data-id="${action.id}">${icon('ChevronRight',15)}</button></div></div>`;
  }).join('')}</div>`:weekEmpty(state.weekActions==='completed'?'No dated completions this week':state.weekActions==='client'?'No recorded client dependencies':'No actions due this week','Other actions are available in the full register.'))+`<div class="panel-footer"><span>${state.weekActions==='completed'?'Reported completion · verification is separate':next.length?`${next.length} action${next.length===1?'':'s'} due after this week`:'Includes carried-over overdue work'}</span>${next.length?`<button class="text-button" data-action="tab" data-id="${client.id}" data-tab="commitments">View all${icon('ArrowRight',12)}</button>`:''}</div>`;
}

function renderWeeklyDeliverables(client) {
  const items=DATA.WEEKLY_DELIVERABLES.map((item,index)=>({...item,index,due:item.actionId?state.actions.find(a=>a.id===item.actionId)?.due:item.due})).filter(item=>item.clientId===client.id);
  const shown=items.filter(item=>inWeek(item.due)||inWeek(item.deliveredAt)||inWeek(item.updatedAt)||(item.due&&item.due<weekWindow().start&&!item.deliveredAt));
  const next=items.filter(item=>!shown.includes(item)&&item.due>weekWindow().end);
  return (shown.length?shown.map(item=>`<button class="deliverable-row" data-action="deliverable-details" data-id="${item.index}"><span class="document-icon">${icon('FileText',18)}</span><span class="deliverable-content"><strong>${escapeHtml(item.title)}</strong><span class="deliverable-meta">${escapeHtml(item.owner)} · ${item.due?'Due '+dateLabel(item.due):'Due date not recorded'}</span>${badge(item.stage,item.deliveredAt?'green':'amber',false)}</span>${icon('ChevronRight',15)}</button>`).join(''):weekEmpty('No deliverables recorded this week',next.length?`Next planned: ${next[0].title} · ${dateLabel(next[0].due)}.`:'No current-week delivery evidence is available.'))+`<div class="panel-footer"><span>${shown.length} output${shown.length===1?'':'s'} · delivery tracked separately from tasks</span></div>`;
}

function renderWeeklyNextMeeting(client) {
  const call=nextClientCall(client);
  if(!call)return panel('Next meeting',weekEmpty('No upcoming meeting recorded','A matched calendar event is needed for preparation.'));
  return panel('Next meeting',`<div class="meeting-preview"><div class="date-tile"><span>${dateLabel(call.date,{month:'short'})}</span><strong>${new Date(call.date+'T12:00:00Z').getUTCDate()}</strong></div><div class="meeting-preview-text"><h3>${escapeHtml(call.type)}</h3><p>${dateLabel(call.date,{weekday:'short',day:'numeric',month:'short'})} · ${timeLabel(call.time)} IST · ${escapeHtml(call.duration)}</p><span>${escapeHtml(call.host)}${!inWeek(call.date)?' · After this week':''}</span></div>${badge(call.date===DEMO_DATE?'Today':'Scheduled',call.date===DEMO_DATE?'blue':'neutral',false)}</div><p class="meeting-objective">${escapeHtml(call.objective)}</p><div class="meeting-prep-bar"><span>${icon('FileCheck2',15)}Sample brief · ready to review</span><button class="button button-outline button-small" data-action="call" data-id="${call.id}">Open meeting prep${icon('ArrowRight',13)}</button></div>`);
}

function renderWeeklyLastMeeting(client) {
  const source=EVIDENCE.filter(s=>s.clientId===client.id&&['Zoom','Fathom'].includes(s.kind)&&s.date<=DEMO_DATE).sort((a,b)=>b.date.localeCompare(a.date))[0];
  if(!source)return panel('Last meeting',weekEmpty('No readable meeting evidence','This does not establish that no meeting took place.'));
  const recap=DATA.MEETING_RECAPS[source.id];
  return panel('Last meeting',`<div class="last-meeting-meta"><span class="document-icon">${sourceIcon(source.kind,18)}</span><div><h3>${escapeHtml(source.title)}</h3><p>${dateLabel(source.date,{day:'numeric',month:'short',year:'numeric'})} · Latest available excerpt</p></div></div><p class="meeting-summary">${escapeHtml(recap?.discussed||source.excerpt)}</p><details class="recap-details"><summary>Decisions & follow-through${icon('ChevronDown',14)}</summary><div><p class="small-label">AGREED / REQUESTED THEN</p><p>${escapeHtml(recap?.agreed||'No separate decision record is available.')}</p><p class="small-label">CURRENT POSITION</p><p>${escapeHtml(client.summary)}</p>${sourceLink(source.id,'Meeting evidence')}</div></details>`);
}

function renderWeeklyCommunication(client) {
  const all=EVIDENCE.filter(s=>s.clientId===client.id&&['Gmail','Slack'].includes(s.kind)&&inWeek(s.date)&&s.date<=DEMO_DATE).sort((a,b)=>b.date.localeCompare(a.date));
  const shown=all.filter(s=>state.weekChannel==='all'||s.kind===state.weekChannel);
  return segmented('Communication channel','week-channel',state.weekChannel,[['all','All',all.length],['Slack','Chats',all.filter(s=>s.kind==='Slack').length],['Gmail','Email',all.filter(s=>s.kind==='Gmail').length]])+(shown.length?shown.map(source=>{
    const context=DATA.COMMUNICATION_CONTEXT[source.id],actions=clientActions(client).filter(a=>a.sourceId===source.id&&isOutstanding(a));
    return `<details class="communication-thread"><summary><span class="channel-icon">${sourceIcon(source.kind,17)}</span><div class="communication-summary"><div class="communication-title"><h3>${escapeHtml(source.title)}</h3><span>${dateLabel(source.date)}</span></div><p>${escapeHtml(context?.summary||source.excerpt.split('\n')[0])}</p><div class="communication-byline">${escapeHtml(source.author)}<span>·</span>${escapeHtml(context?.direction||source.kind)}${actions.length?`<span>·</span><strong>${actions.length} linked action${actions.length===1?'':'s'}</strong>`:''}</div></div>${icon('ChevronDown',16)}</summary><div class="communication-body"><div class="communication-source">${badge(context?.status||'Recorded excerpt','neutral',false)}<span>${escapeHtml(source.locator)}</span></div><blockquote>${escapeHtml(source.excerpt)}</blockquote><div class="communication-links">${sourceLink(source.id,'Source evidence')}${actions.map(a=>`<button class="text-button" data-action="action-details" data-id="${a.id}">${escapeHtml(a.title)}${icon('ArrowRight',12)}</button>`).join('')}</div></div></details>`;
  }).join(''):weekEmpty('No matching communication','No matching excerpts are available for this week.'))+`<div class="panel-footer"><span>Excerpts only · missing sources do not establish no communication.</span></div>`;
}

function renderThisWeek(client) {
  const {start,end}=weekWindow(),focus=DATA.WEEKLY_FOCUS[client.id],sets=weeklyActionSets(client);
  const open=clientActions(client).filter(isOutstanding),late=open.filter(isOverdue).length;
  return `<div class="week-view" data-view="this-week"><div class="week-heading"><div><h2>This week</h2><span>${dateLabel(start)} – ${dateLabel(end,{day:'numeric',month:'short',year:'numeric'})}<span class="subtle-divider">/</span>IST</span></div><div class="week-counters"><span><strong>${sets.attention.length}</strong> due or overdue</span><span class="${late?'counter-warning':''}"><strong>${late}</strong> overdue</span><span><strong>${sets.client.length}</strong> awaiting client</span></div></div>
    <section class="weekly-priority" data-week-section="focus"><div class="priority-label">${icon('Target',18)}<span>Weekly focus<small>Suggested · team review</small></span></div><div class="priority-content"><h3>${escapeHtml(client.focus)}</h3><div class="priority-blocker">${badge(focus.label,focus.tone,false)}<span>${escapeHtml(focus.detail)}</span></div></div><button class="icon-button" aria-label="View weekly focus context" data-action="focus-details" data-id="${client.id}">${icon('ArrowUpRight',17)}</button></section>
    <div class="week-work" data-week-section="work">${panel('Action items',renderWeeklyActions(client),'',`<button class="text-button" data-action="tab" data-id="${client.id}" data-tab="commitments">All actions${icon('ArrowRight',14)}</button>`,'weekly-actions')}${panel('Deliverables',renderWeeklyDeliverables(client),'',`<span class="panel-subtitle">Outputs & handoffs</span>`,'weekly-deliverables')}</div>
    <div class="week-meetings" data-week-section="meetings">${renderWeeklyNextMeeting(client)}${renderWeeklyLastMeeting(client)}</div>
    <div data-week-section="communication">${panel('Communication',renderWeeklyCommunication(client),'',`<span class="panel-subtitle">This week · newest first</span>`,'weekly-communication')}</div></div>`;
}

function renderProfile(client) {
  return `<div class="profile-grid"><div class="profile-main">${panel('Business overview',`<p class="profile-story">${escapeHtml(client.story)}</p><div class="profile-goal"><span>${icon('Target',17)}</span><div><h3>Engagement goal</h3><p>${escapeHtml(client.goal)}</p></div></div><div class="profile-facts">${[['Audience',client.audience],['Differentiator',client.differentiator],['Brand voice',client.voice]].map(([label,value])=>`<div><h3>${label}</h3><p>${escapeHtml(value)}</p>${sourceLink(client.profileSource,'Source')}</div>`).join('')}</div>`)}${panel('Current engagement',`<div class="engagement-row"><span class="document-icon">${icon('FolderOpen',19)}</span><div><h3>${escapeHtml(client.service)}</h3><p>${client.type==='retainer'?'Retainer engagement':'Accelerator programme'} · Since ${dateLabel(client.since,{month:'short',year:'numeric'})}</p></div>${badge('Active','green',false)}</div>`)}</div><aside>${panel('People & account',detailsList([['WIA manager',person(client.manager)],['Client contact',escapeHtml(client.contact)],['Email',escapeHtml(client.email)],['Location',escapeHtml(client.location)],['Engagement began',dateLabel(client.since,{day:'numeric',month:'short',year:'numeric'})]]))}<div class="account-note">${icon('Info',15)}<p>Profile facts retain their supporting source. Manager assignments are sample data.</p></div></aside></div>`;
}

function renderHistory(client) {
  const lanes = ['Onboarding', 'Communication', 'Meetings', 'Commitments', 'Work delivered'];
  const events = EVENTS.filter(event => event.clientId === client.id && (state.historyLane === 'all' || event.lane === state.historyLane));
  const start = new Date(`${client.since}T12:00:00`).getTime();
  const duration = Math.max(new Date(`${DEMO_DATE}T12:00:00`).getTime() - start, 1);
  const spine = `<div class="spine-scroll"><div class="spine"><div class="spine-dates"><span>${dateLabel(client.since)}</span><span>Record through Oct 9</span></div>
    ${lanes.filter(lane => state.historyLane === 'all' || state.historyLane === lane).map((lane, index) => `<div class="spine-lane"><span class="spine-label">${lane}</span><div class="spine-track lane-${index}">
      ${events.filter(event => event.lane === lane).map(event => `<button aria-label="${escapeHtml(event.title)}, ${dateLabel(event.date)}" title="${dateLabel(event.date)} · ${escapeHtml(event.title)}" style="left:${Math.max(1, Math.min(97, (new Date(`${event.date}T12:00:00`).getTime() - start) / duration * 100))}%" data-action="evidence" data-id="${event.sourceId}"></button>`).join('')}
    </div></div>`).join('')}</div></div>
    <div class="spine-legend"><span><i class="legend-dot"></i>An event with source context</span><span>Empty periods mean no entries in this preview.</span></div>`;
  const feed = `<div class="history-feed">${[...events].reverse().map(event => `<div class="history-event">
    <div class="history-date">${dateLabel(event.date)}<small>${event.lane}</small></div><div class="history-node"><span></span></div>
    <div class="history-copy"><h3>${escapeHtml(event.title)}</h3><p>${escapeHtml(event.detail)}</p></div>${sourceLink(event.sourceId)}
  </div>`).join('')}${!events.length ? empty('No events in this category') : ''}</div>`;
  return `<div class="toolbar">
    ${segmented('History display', 'history-mode', state.historyMode, [['spine', 'Engagement spine'], ['feed', 'Activity feed']])}
    <label class="sr-only" for="history-lane">History category</label>
    ${selectControl('History category', 'historyLane', state.historyLane, [['all', 'All categories'], ...lanes.map(lane => [lane, lane])], 'history-lane')}
  </div>
  ${state.historyMode === 'spine' ? panel('The shape of the engagement', spine, 'ONE HISTORY, SEVERAL THREADS') : ''}
  ${panel(state.historyMode === 'spine' ? 'Moments that shaped the account' : 'The account, in order', feed, 'THE EVIDENCE TRAIL')}
  <div class="note-box">${icon('History', 17)}<p>This record begins ${dateLabel(client.since)}. Earlier history is not included; a missing entry is not proof that nothing happened.</p></div>`;
}

function renderBrief(client) {
  const open=clientActions(client).filter(isOutstanding);
  return panel('Handover brief',`<div class="handover-meta">${person(client.manager)}<span>Snapshot · ${dateLabel(DEMO_DATE,{day:'numeric',month:'short',year:'numeric'})}</span></div><div class="handover-sections"><section><span>01</span><div><h3>Business & goal</h3><p>${escapeHtml(client.story)}</p><p><strong>Goal:</strong> ${escapeHtml(client.goal)}</p>${sourceLink(client.profileSource)}</div></section><section><span>02</span><div><h3>Current position</h3><p>${escapeHtml(client.summary)}</p><p><strong>Focus:</strong> ${escapeHtml(client.focus)}</p></div></section><section><span>03</span><div><h3>Outstanding commitments</h3>${open.map(a=>`<button class="handover-action" data-action="action-details" data-id="${a.id}"><span>${escapeHtml(a.title)}</span><small>${escapeHtml(a.owner)} · ${dateLabel(a.due)}</small>${icon('ArrowUpRight',13)}</button>`).join('')||'<p>No open commitments recorded.</p>'}</div></section><section><span>04</span><div><h3>Known limitations</h3><p>Sample record from ${dateLabel(client.since)}. Earlier conversations and live advertising performance are not represented.</p></div></section></div>`,'',`<button class="button button-outline button-small" data-action="copy-brief" data-id="${client.id}">${icon('Clipboard',14)}Copy brief</button>`);
}

function renderCommitments(client) {
  const rows = clientActions(client).filter(action => state.commitmentSide === 'all' || action.side === state.commitmentSide);
  return `<div class="toolbar">${segmented('Commitment side', 'commitment-side', state.commitmentSide, [
    ['all', 'All commitments'], ['WIA', 'What we owe them'], ['Client', 'What we need from them']
  ])}</div>${panel('', renderActionRows(rows))}`;
}

function renderActionRows(rows) {
  return `<div class="action-rows compact">${rows.map(action => {
    const client = clientById(action.clientId), outstanding = isOutstanding(action);
    return `<div class="action-row ${outstanding ? '' : 'completed'}" data-action-row="${action.id}">
      <button class="action-checkbox ${outstanding ? '' : 'checked'}" aria-label="${outstanding ? 'Mark' : 'Reopen'} ${escapeHtml(action.title)}${outstanding ? ' done' : ''}" title="${outstanding ? 'Mark done' : 'Reopen action'}" data-action="toggle-action" data-id="${action.id}">${outstanding ? '' : icon('Check', 13)}</button>
      <div class="action-main"><button class="action-title" data-action="action-details" data-id="${action.id}">${escapeHtml(action.title)}</button>
        <div class="action-subline"><button data-action="client" data-id="${client.id}">${escapeHtml(client.name)}</button><span>·</span><span>${action.side === 'Client' ? 'Waiting on client' : escapeHtml(action.owner)}</span>${!action.acknowledged && outstanding ? '<span class="text-amber">· Not acknowledged</span>' : ''}</div>
      </div>
      <div class="action-due"><span class="${isOverdue(action) ? 'text-amber' : ''}">${isOverdue(action) ? 'Overdue · ' : action.due === DEMO_DATE ? 'Today · ' : ''}${dateLabel(action.due)}</span>
        ${badge(action.status, action.status === 'Verified' ? 'green' : action.status === 'Done' ? 'blue' : action.status === 'In progress' ? 'gold' : 'neutral', false)}
      </div>${sourceLink(action.sourceId)}
      ${action.status === 'Done' ? `<button class="button button-small button-outline" data-action="verify-action" data-id="${action.id}">${icon('CheckCheck', 13)}Verify</button>` : `<button class="icon-button" aria-label="Details for ${escapeHtml(action.title)}" data-action="action-details" data-id="${action.id}">${icon('ChevronRight', 17)}</button>`}
    </div>`;
  }).join('')}${rows.length ? '' : empty('All clear in this view')}</div>`;
}

function renderMeetings(client) {
  const call = CALLS.find(item => item.clientId === client.id);
  const meetings = EVIDENCE.filter(source => source.clientId === client.id && ['Zoom', 'Fathom'].includes(source.kind));
  return panel('The conversations behind the account', meetings.map(source => `<div class="meeting-record">
    <span class="meeting-icon">${icon('MessageSquare', 22, 1.5)}</span><div><h3>${escapeHtml(source.title)}</h3><p>${dateLabel(source.date)} · ${escapeHtml(source.author)}</p><span class="muted small-text">${escapeHtml(source.locator)} · ${source.tag}</span></div>${sourceLink(source.id, 'Read transcript')}
  </div>`).join('') + (call ? `<div class="next-meeting"><p class="small-label">NEXT SCHEDULED</p><h3>${call.type} · ${dateLabel(call.date)}</h3><button class="text-button" data-action="call" data-id="${call.id}">Read the upcoming brief${icon('ArrowRight', 14)}</button></div>` : ''), 'CALLS & RECORDED DECISIONS');
}

function renderInvoices(client) {
  const rows = INVOICES.filter(invoice => invoice.clientId === client.id);
  return panel('The agreement & invoice record', `<div class="table-scroll"><table class="invoice-table">
    <thead><tr><th>Client / invoice</th><th>Amount</th><th>Due date</th><th>Standing</th><th>Terms</th></tr></thead>
    <tbody>${rows.map(invoice => `<tr><td><button class="table-client" data-action="tab" data-id="${client.id}" data-tab="money">${avatar(client, true)}<span><strong>${escapeHtml(client.name)}</strong><small>${invoice.id} · issued ${dateLabel(invoice.issued)}</small></span></button></td>
      <td><strong>${money(invoice.amount)}</strong></td><td>${dateLabel(invoice.due)}${invoice.paid ? `<small class="block muted">Paid ${dateLabel(invoice.paid)}</small>` : ''}</td>
      <td>${badge(invoice.status, invoice.status === 'Paid' ? 'green' : invoice.status === 'Overdue' ? 'amber' : 'blue')}</td>
      <td><button class="text-button" data-action="invoice" data-id="${invoice.id}">View terms${icon('ArrowUpRight', 13)}</button></td></tr>`).join('')}</tbody>
    </table>${rows.length ? '' : empty('No invoices in this view')}</div>`, 'COMMERCIAL CONTEXT');
}

function renderAttendance(client) {
  return panel('A programme with people in it', `<p class="body-copy">Recent sessions for ${escapeHtml(client.contact)}. These are sample attendance records, distinct from transcript availability.</p>
    <div class="attendance-list">${['2026-09-24', '2026-10-01', '2026-10-08'].map((date, index) => {
      const missed = client.id === 'willow' && index > 0;
      return `<div>${icon('CalendarDays', 18)}<div><strong>${client.service.includes('Meta') ? 'Meta' : 'Google'} office hours</strong><small>${dateLabel(date)}</small></div>
        ${badge(missed ? 'Missed' : 'Attended', missed ? 'amber' : 'green')}
        ${index === 0 && client.id === 'willow' ? sourceLink('willow-fathom') : '<span class="muted small-text">Transcript not in preview</span>'}</div>`;
    }).join('')}</div>`, 'OFFICE-HOUR ATTENDANCE');
}

// 5. RELATED CALL BRIEFS (REACHED FROM CLIENT RECORDS)

function renderCallBrief(call) {
  const client = clientById(call.clientId);
  return `<div class="view">
    <button class="back-link" data-action="client" data-id="${client.id}">${icon('ArrowLeft', 14)}Back to ${escapeHtml(client.name)}</button>
    <div class="page-heading"><div><p class="eyebrow">BEFORE THE CONVERSATION</p><h1>Walk in with context.</h1><p class="page-description">A concise, cited brief, shaped around the purpose of each call.</p></div>

function showDialog(title, content, subtitle = '', drawer = true, kind = '') {
  closeDialog();
  const previousFocus = document.activeElement;
  const host = document.getElementById('dialog-host');
  host.innerHTML = `<dialog class="${drawer ? 'drawer' : 'modal'}" aria-labelledby="dialog-title">
    <div class="dialog-heading"><div>${subtitle ? `<p class="eyebrow">${escapeHtml(subtitle)}</p>` : ''}<h2 id="dialog-title">${escapeHtml(title)}</h2></div>
      <button class="icon-button" aria-label="Close dialog" data-action="close-dialog">${icon('X', 20)}</button></div>
    <div class="dialog-body">${content}</div></dialog>`;
  const dialog = host.querySelector('dialog');
  state.dialog = { element: dialog, previousFocus, kind };
  dialog.addEventListener('cancel', event => { event.preventDefault(); closeDialog(); });
  dialog.addEventListener('click', event => {
    const rect = dialog.getBoundingClientRect();
    if (event.target === dialog && (event.clientX < rect.left || event.clientX > rect.right || event.clientY < rect.top || event.clientY > rect.bottom)) closeDialog();
  });
  dialog.showModal();
}

function closeDialog() {
  if (!state.dialog) return;
  closeSelect(false);
  closeCalendar(false);
  const { element, previousFocus } = state.dialog;
  state.dialog = null;

}

// 7. ACCESSIBLE SELECT MENUS AND DATE PICKER (LOCAL DOM ONLY)

function placePopover(element, trigger, requestedWidth, estimatedHeight) {
  const rect = trigger.getBoundingClientRect();
  const width = Math.min(requestedWidth, innerWidth - 24);
  const below = innerHeight - rect.bottom - 16;
  const above = rect.top - 16;
  const flip = below < estimatedHeight && above > below;
  const height = Math.max(40, Math.min(estimatedHeight, flip ? above : below));
  Object.assign(element.style, {
    left: `${Math.max(12, Math.min(rect.left, innerWidth - width - 12))}px`,
    top: `${flip ? Math.max(12, rect.top - height - 6) : rect.bottom + 6}px`,
    width: `${width}px`, maxHeight: `${height}px`
  });
}

function openSelect(trigger) {
  if (state.select?.trigger === trigger) { closeSelect(); return; }
  closeSelect(false);
  closeCalendar(false);
  const options = JSON.parse(trigger.dataset.options);
  const menu = document.createElement('div');
  menu.id = 'select-menu';
  menu.className = 'atelier-select-menu';
  menu.setAttribute('role', 'listbox');
  menu.setAttribute('aria-label', trigger.getAttribute('aria-label'));
  menu.innerHTML = options.map(([value, label], index) => `<div id="select-option-${index}" class="atelier-select-option ${value === trigger.dataset.value ? 'is-selected' : ''}" role="option" aria-selected="${value === trigger.dataset.value}" data-action="select-option" data-value="${escapeHtml(value)}" data-index="${index}">${escapeHtml(label)}${value === trigger.dataset.value ? icon('Check', 14) : ''}</div>`).join('');
  (trigger.closest('dialog') || document.body).append(menu);
  trigger.setAttribute('aria-expanded', 'true');
  trigger.setAttribute('aria-controls', menu.id);
  state.select = { trigger, menu, options, index: Math.max(0, options.findIndex(([value]) => value === trigger.dataset.value)) };
  placePopover(menu, trigger, Math.max(trigger.getBoundingClientRect().width, 220), Math.min(options.length * 40 + 12, 240));
  highlightSelectOption();
}

function highlightSelectOption() {
  const select = state.select;
  select.menu.querySelectorAll('[role="option"]').forEach((option, index) => option.classList.toggle('is-active', index === select.index));
  const active = select.menu.children[select.index];
  select.trigger.setAttribute('aria-activedescendant', active.id);
  active.scrollIntoView({ block: 'nearest' });
}

function closeSelect(restore = true) {
  if (!state.select) return;
  const { trigger, menu } = state.select;
  state.select = null;
  menu.remove();
  trigger.setAttribute('aria-expanded', 'false');
  trigger.removeAttribute('aria-controls');
  trigger.removeAttribute('aria-activedescendant');
  if (restore && trigger.isConnected) trigger.focus();
}

function chooseSelect(value) {
  const { trigger } = state.select;
  const key = trigger.dataset.select;
  closeSelect(false);
  if (key.includes(':')) {
    const [field, id] = key.split(':');
    updateAction(id, { [field]: value });
    state.dialog.element.querySelector(`[data-select="${key}"]`)?.focus();
  } else {
    state[key] = value;
    if (key === 'sort') {
      trigger.dataset.value = value;
      trigger.querySelector('span').textContent = JSON.parse(trigger.dataset.options).find(([id]) => id === value)[1];
      updatePortfolioCards();
      trigger.focus();
    } else {
      renderPage();
      document.querySelector(`[data-select="${key}"]`)?.focus();
    }
  }
}

function openCalendar(trigger) {
  closeSelect(false);
  closeCalendar(false);
  const action = state.actions.find(item => item.id === trigger.dataset.id);
  const date = new Date(`${action.due}T12:00:00Z`);
  const element = document.createElement('div');
  element.className = 'atelier-calendar';
  element.setAttribute('role', 'dialog');
  element.setAttribute('aria-label', 'Choose due date');
  (trigger.closest('dialog') || document.body).append(element);
  trigger.setAttribute('aria-expanded', 'true');
  state.calendar = { trigger, element, actionId: action.id, month: date.getUTCMonth(), year: date.getUTCFullYear() };
  renderCalendar();
}

function renderCalendar() {
  const calendar = state.calendar;
  const { month, year, element, trigger } = calendar;
  const action = state.actions.find(item => item.id === calendar.actionId);
  const today = new Date().toLocaleDateString('en-CA', { timeZone: 'Asia/Kolkata' });
  const count = new Date(Date.UTC(year, month + 1, 0)).getUTCDate();
  const leading = (new Date(Date.UTC(year, month, 1)).getUTCDay() + 6) % 7;
  const monthLabel = new Intl.DateTimeFormat('en-IN', { timeZone: 'UTC', month: 'long', year: 'numeric' }).format(new Date(Date.UTC(year, month, 1)));
  element.innerHTML = `<div class="atelier-calendar-title"><span>Due date</span><button class="icon-button" aria-label="Close calendar" data-action="close-calendar">${icon('X', 16)}</button></div>
    <div class="atelier-calendar-month"><button class="icon-button" aria-label="Previous month" data-action="calendar-month" data-value="-1">${icon('ChevronLeft', 16)}</button><strong aria-live="polite">${monthLabel}</strong><button class="icon-button" aria-label="Next month" data-action="calendar-month" data-value="1">${icon('ChevronRight', 16)}</button></div>
    <div class="atelier-calendar-grid">${['M', 'T', 'W', 'T', 'F', 'S', 'S'].map(day => `<span class="atelier-weekday">${day}</span>`).join('')}${'<span></span>'.repeat(leading)}
      ${Array.from({ length: count }, (_, index) => { const next = new Date(Date.UTC(year, month, index + 1, 12)).toISOString().slice(0, 10); return `<button data-day="${index + 1}" aria-label="${dateLabel(next, { day: 'numeric', month: 'short', year: 'numeric' })}" aria-pressed="${action.due === next}" class="${action.due === next ? 'selected' : next === today ? 'today' : ''}" data-action="calendar-day" data-value="${next}">${index + 1}</button>`; }).join('')}
    </div><div class="atelier-calendar-footer"><span>${dateLabel(action.due, { day: 'numeric', month: 'short', year: 'numeric' })}</span><button class="text-button" data-action="calendar-day" data-value="${today}">Today</button></div>`;
  placePopover(element, trigger, 320, element.getBoundingClientRect().height);
  (element.querySelector('[aria-pressed="true"]') || element.querySelector('[data-day]')).focus();
}

function closeCalendar(restore = true) {
  if (!state.calendar) return;
  const { trigger, element } = state.calendar;
  state.calendar = null;
  element.remove();
  trigger.setAttribute('aria-expanded', 'false');
  if (restore && trigger.isConnected) trigger.focus();
}

async function copyText(text, successMessage) {
  try {
    if (navigator.clipboard?.writeText) await navigator.clipboard.writeText(text);
    else {
      const field = document.createElement('textarea');
      field.value = text;
      field.style.cssText = 'position:fixed;left:-9999px;top:0';
      (state.dialog?.element || document.body).append(field);
      field.select();
      const copied = document.execCommand('copy');
      field.remove();
      if (!copied) throw new Error('Clipboard unavailable');
    }
    notify(successMessage);
  } catch {
    showDialog('Copy this brief', `<textarea class="export-copy-text" readonly aria-label="Brief text">${escapeHtml(text)}</textarea>`, 'HANDOVER & CONTINUITY', false);
    state.dialog.element.querySelector('textarea').select();
  }
}

function downloadText(text, name) {
  const url = URL.createObjectURL(new Blob([text], { type: 'text/markdown;charset=utf-8' }));
  const link = document.createElement('a');
  link.href = url;
  link.download = name;
  link.click();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
  notify('Sample call brief downloaded.');
}

function notify(message) {
  clearTimeout(state.toastTimer);
  document.getElementById('toast-host').innerHTML = `<div class="toast" role="status">${icon('CheckCircle2', 17)}<span>${escapeHtml(message)}</span><button class="icon-button" aria-label="Dismiss notification" data-action="dismiss-toast">${icon('X', 14)}</button></div>`;
  state.toastTimer = setTimeout(() => document.getElementById('toast-host').replaceChildren(), 4000);
}

// 9. EVENT DELEGATION — NO INLINE JAVASCRIPT ATTRIBUTES

function handleClick(event) {
  const button = event.target.closest('[data-action]');
  if (!button || button.disabled) return;
  const { action, id, value, tab } = button.dataset;
  if (action === 'skip') { event.preventDefault(); document.getElementById('main-content').focus(); return; }
  switch (action) {
    case 'density': state.density = state.density === 'compact' ? 'comfortable' : 'compact'; saveWorkspacePreferences(); renderPage(); break;
    case 'reset-filters': state.query = ''; state.filter = 'all'; state.manager = 'all'; state.service = 'all'; saveWorkspacePreferences(); renderPage(); break;
    case 'focus-details': showFocus(id); break;
    case 'deliverable-details': showDeliverable(id); break;
    case 'portfolio': navigate('clients'); break;
    case 'client': openClient(id); break;
    case 'tab': {
      const previous = getRoute();
      if (previous.tab !== tab || previous.client?.id !== id) {
        state.historyMode = 'feed'; state.historyLane = 'all'; state.commitmentSide = 'all'; state.weekActions = 'attention'; state.weekChannel = 'all';
      }
      openClient(id, tab); break;
    }
    case 'call': openCall(id); break;
    case 'collapse': state.collapsed = !state.collapsed; syncSidebar(); break;
    case 'open-navigation': state.mobileOpen = true; syncSidebar(); document.querySelector('.mobile-close').focus(); break;

    case 'layout': state.layout = value; saveWorkspacePreferences(); renderPage(); document.querySelector(`[data-action="layout"][data-value="${value}"]`).focus(); break;
    case 'clear-search': state.query = ''; document.querySelector('[data-input="portfolio-search"]').value = ''; updatePortfolioCards(); document.querySelector('[data-input="portfolio-search"]').focus(); break;
    case 'history-mode': state.historyMode = value; renderPage(); document.querySelector(`[data-action="history-mode"][data-value="${value}"]`).focus(); break;
    case 'commitment-side': state.commitmentSide = value; renderPage(); document.querySelector(`[data-action="commitment-side"][data-value="${value}"]`).focus(); break;
    case 'week-actions': state.weekActions = value; renderPage(); document.querySelector(`[data-action="week-actions"][data-value="${value}"]`)?.focus(); break;
    case 'week-channel': state.weekChannel = value; renderPage(); document.querySelector(`[data-action="week-channel"][data-value="${value}"]`)?.focus(); break;
    case 'evidence': showEvidence(id); break;
    case 'sources': showSources(id); break;
    case 'invoice': showInvoice(id); break;
    case 'action-details': showAction(id); break;
    case 'toggle-action': { const item = state.actions.find(item => item.id === id); updateAction(id, { status: isOutstanding(item) ? 'Done' : 'Open' }); break; }
    case 'verify-action': updateAction(id, { status: 'Verified' }); notify('Verification recorded in the preview.'); break;
    case 'acknowledge': updateAction(id, { acknowledged: !state.actions.find(item => item.id === id).acknowledged }); break;
    case 'select': openSelect(button); break;
    case 'select-option': chooseSelect(value); break;
    case 'calendar': openCalendar(button); break;
    case 'close-calendar': closeCalendar(); break;
    case 'calendar-month': {
      const next = new Date(Date.UTC(state.calendar.year, state.calendar.month + Number(value), 1));
      state.calendar.year = next.getUTCFullYear(); state.calendar.month = next.getUTCMonth(); renderCalendar(); break;
    }
    case 'calendar-day': {
      const actionId = state.calendar.actionId;
      closeCalendar(false); updateAction(actionId, { due: value });
      state.dialog.element.querySelector('[data-action="calendar"]')?.focus(); break;
    }
    case 'close-dialog': closeDialog(); break;
    case 'alerts': showAlerts(); break;
    case 'about': showAbout(); break;
    case 'search': showSearch(); break;
    case 'copy-brief': copyText(clientBriefText(clientById(id)), 'Handover brief copied.'); break;
    case 'copy-call': copyText(callBriefText(CALLS.find(call => call.id === id)), 'Call brief copied to your clipboard.'); break;

  }
}

function handleInput(event) {
  if (event.target.dataset.input === 'portfolio-search') {
    state.query = event.target.value;
    updatePortfolioCards();
  }
  if (event.target.dataset.input === 'global-search') updateGlobalSearch(event.target.value);
}

function handleKeydown(event) {
  if ((event.ctrlKey || event.metaKey) && event.key.toLowerCase() === 'k') {
    event.preventDefault(); state.dialog?.kind === 'search' ? closeDialog() : showSearch(); return;
  }
  if (state.select) {
    if (event.key === 'Escape') { event.preventDefault(); event.stopPropagation(); closeSelect(); return; }
    if (event.key === 'Tab') { closeSelect(false); return; }
    if (['ArrowDown', 'ArrowUp', 'Home', 'End'].includes(event.key)) {
      event.preventDefault();
      const select = state.select;
      select.index = event.key === 'Home' ? 0 : event.key === 'End' ? select.options.length - 1 : (select.index + (event.key === 'ArrowDown' ? 1 : -1) + select.options.length) % select.options.length;
      highlightSelectOption(); return;
    }
    if (['Enter', ' '].includes(event.key)) { event.preventDefault(); chooseSelect(state.select.options[state.select.index][0]); return; }
    if (event.key.length === 1) {
      const index = state.select.options.findIndex(([, label]) => label.toLowerCase().startsWith(event.key.toLowerCase()));
      if (index >= 0) { state.select.index = index; highlightSelectOption(); } return;
    }
  } else if (event.target.matches('[role="combobox"]') && ['ArrowDown', 'ArrowUp', 'Home', 'End'].includes(event.key)) {
    event.preventDefault(); openSelect(event.target); return;
  }
  if (state.calendar && state.calendar.element.contains(event.target)) {
    if (event.key === 'Escape') { event.preventDefault(); event.stopPropagation(); closeCalendar(); return; }
    const movement = { ArrowLeft: -1, ArrowRight: 1, ArrowUp: -7, ArrowDown: 7 }[event.key];
    if (movement !== undefined && event.target.dataset.day) {
      event.preventDefault(); state.calendar.element.querySelector(`[data-day="${Number(event.target.dataset.day) + movement}"]`)?.focus(); return;
    }
    if (event.key === 'Tab') trapFocus(event, state.calendar.element);
  }
  if (state.mobileOpen && matchMedia('(max-width: 700px)').matches) {
    if (event.key === 'Escape') { state.mobileOpen = false; syncSidebar(); document.querySelector('.mobile-menu').focus(); }
    if (event.key === 'Tab') trapFocus(event, document.querySelector('.sidebar'));
  }
}

function trapFocus(event, element) {
  const controls = [...element.querySelectorAll('button:not(:disabled), input, a[href], textarea')].filter(control => control.getClientRects().length);
  if (event.shiftKey && document.activeElement === controls[0]) { event.preventDefault(); controls.at(-1)?.focus(); }
  if (!event.shiftKey && document.activeElement === controls.at(-1)) { event.preventDefault(); controls[0]?.focus(); }
}

// 10. BLUE PERIMETER LIGHT — SAME SCALE, COLOURS AND 16 SECOND PERIOD

function startSidebarOrbit() {
  const element = document.querySelector('.sidebar-orbit');
  const canvas = element.querySelector('canvas');
  const context = canvas.getContext('2d');
  if (!context) return;
  const padding = 16, sampleCount = 1024;
  const motion = matchMedia('(prefers-reduced-motion: reduce)');
  let points = [], perimeter = 1, frame = 0, startedAt = null, width = 0, height = 0;
  function resize() {
    const rect = element.getBoundingClientRect(), ratio = Math.min(devicePixelRatio || 1, 2);
    width = rect.width + padding * 2; height = rect.height + padding * 2;
    canvas.width = Math.round(width * ratio); canvas.height = Math.round(height * ratio);
    context.setTransform(ratio, 0, 0, ratio, padding * ratio, padding * ratio);
    const corners = getComputedStyle(element.parentElement);
    const left = parseFloat(corners.borderTopLeftRadius) || 0, right = parseFloat(corners.borderTopRightRadius) || 0;
    const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    path.setAttribute('d', `M${left} 0 H${rect.width - right} Q${rect.width} 0 ${rect.width} ${right} V${rect.height - right} Q${rect.width} ${rect.height} ${rect.width - right} ${rect.height} H${left} Q0 ${rect.height} 0 ${rect.height - left} V${left} Q0 0 ${left} 0 Z`);
    perimeter = Math.max(path.getTotalLength(), 1);
    points = Array.from({ length: sampleCount }, (_, index) => { const point = path.getPointAtLength(index / sampleCount * perimeter); return { x: point.x, y: point.y }; });
  }
  function pointAt(distance) {
    const position = ((distance % perimeter + perimeter) % perimeter) / perimeter * sampleCount;
    const index = Math.floor(position), fraction = position - index;
    const first = points[index], second = points[(index + 1) % sampleCount];
    return { x: first.x + (second.x - first.x) * fraction, y: first.y + (second.y - first.y) * fraction };
  }
  function draw(timestamp) {
    context.clearRect(-padding, -padding, width, height);
    if (points.length && (!matchMedia('(max-width: 700px)').matches || state.mobileOpen)) {
      startedAt ??= timestamp;
      const distance = ((timestamp - startedAt) % 16000) / 16000 * perimeter;
      const head = pointAt(distance), tailLength = Math.min(135, perimeter * .07), tail = pointAt(distance - tailLength);
      const gradient = context.createLinearGradient(tail.x, tail.y, head.x, head.y);
      gradient.addColorStop(0, 'rgba(76,145,239,0)'); gradient.addColorStop(.45, 'rgba(76,145,239,.35)'); gradient.addColorStop(1, '#579aef');
      context.beginPath();
      for (let index = 0; index <= 48; index++) { const point = pointAt(distance - tailLength + index / 48 * tailLength); index ? context.lineTo(point.x, point.y) : context.moveTo(point.x, point.y); }
      context.strokeStyle = gradient; context.lineWidth = 2; context.lineCap = 'round'; context.stroke();
      context.shadowColor = '#4c91ef'; context.shadowBlur = 10; context.beginPath(); context.arc(head.x, head.y, 3.5, 0, Math.PI * 2);
      context.fillStyle = '#e4f3ff'; context.fill(); context.shadowBlur = 0; context.strokeStyle = '#579aef'; context.lineWidth = 1; context.stroke();
    }
    frame = requestAnimationFrame(draw);
  }
  function syncMotion() {
    cancelAnimationFrame(frame); context.clearRect(-padding, -padding, width, height);
    if (!motion.matches) frame = requestAnimationFrame(draw);
  }
  resize(); new ResizeObserver(resize).observe(element); motion.addEventListener('change', syncMotion); syncMotion();
}
